<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080C13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SE180EV Troubleshooting Guide</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#080C13; --panel:#0F1826; --panel2:#0A111B; --inset:#060A10;
  --ink:#E8EFF7; --muted:#8095AD; --line:#1D2B3F; --line2:#2B3D57;
  --accent:#43A0F0; --accent-deep:#0068B7;
  --amber:#F5C451;                /* HMI readout yellow */
  --raise:#F0954A; --lower:#5BB0EE;
  --warn:#F0555A; --ok:#37E38B; --led:#37E38B;   /* signal green */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:9px; --r-sm:6px;
}
body.light{
  --bg:#E7ECF3; --panel:#FFFFFF; --panel2:#EEF2F8; --inset:#DCE4EF;
  --ink:#0F1A28; --muted:#5A6A7E; --line:#CBD6E3; --line2:#B4C3D6;
  --accent:#0068B7; --accent-deep:#00518F;
  --amber:#9A6400; --raise:#B45D17; --lower:#1668A8;
  --warn:#C4353C; --ok:#1F9A66; --led:#1F9A66;
}
/* ============ base ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(color-mix(in srgb,var(--line) 30%,transparent) 1px,transparent 1px) 0 0/42px 42px,
    linear-gradient(90deg,color-mix(in srgb,var(--line) 30%,transparent) 1px,transparent 1px) 0 0/42px 42px,
    radial-gradient(130% 70% at 50% -8%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 55%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::selection{background:rgba(67,160,240,.3)}

/* ============ status LEDs ============ */
.led{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 7px color-mix(in srgb,var(--led) 85%,transparent);flex-shrink:0;display:inline-block}
.led-live{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}48%{opacity:.3}}
.readout{display:inline-flex;align-items:center;gap:9px;flex-shrink:0}

/* ============ top bar (status strip) ============ */
#topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 22%,transparent)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;height:58px;padding:0 12px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--inset);border-radius:var(--r-sm);color:var(--muted);transition:border-color .15s,color .15s,box-shadow .15s;flex-shrink:0}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.iconbtn svg{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:7px;background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;font:800 12px var(--mono);letter-spacing:.02em;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.brand-txt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-name{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.brand-sub{display:flex;align-items:center;gap:6px;font:10px var(--mono);color:var(--muted);letter-spacing:.1em;white-space:nowrap;text-transform:uppercase}

/* ============ layout ============ */
main{max-width:760px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
.view{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ============ bottom tabs (function keys) ============ */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--inset) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;color:var(--muted);transition:color .15s,background .15s;position:relative;border-right:1px solid var(--line)}
.tab:last-child{border-right:none}
.tab svg{width:20px;height:20px}
.tab span{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tab.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tab.active::before{content:"";position:absolute;top:0;left:10px;right:10px;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ============ type & structure ============ */
.eyebrow{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow .sep{opacity:.45;margin:0 4px}
h1.pg{font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.01em;margin:6px 0 4px}
.lead{font-size:15.5px;color:var(--ink);margin:10px 0 0}
.dim{color:var(--muted)}
.ghead{margin:26px 0 12px}
.ghead:first-child{margin-top:4px}
.ghead .eyebrow{position:relative;padding-left:15px;color:var(--ink)}
.ghead .eyebrow::before{content:"";position:absolute;left:0;top:1px;width:7px;height:7px;background:var(--accent);box-shadow:0 0 7px var(--accent)}
.ghead .rule{height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),var(--line) 45%,transparent);margin-top:9px}
.note{font-size:13px;color:var(--muted);margin-top:6px}

/* ============ cards & rows ============ */
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
a.card,button.card{display:block;width:100%;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
a.card:hover,button.card:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));transform:translateY(-1px);box-shadow:0 4px 18px -8px color-mix(in srgb,var(--accent) 45%,transparent)}
.stack{display:grid;gap:10px}
.grid2{display:grid;gap:10px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px}
.row .rc{min-width:0;flex:1}
.row .rt{font-size:15px;font-weight:650}
.row .rs{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);flex-shrink:0}
.chev svg{width:18px;height:18px;display:block}
.icobox{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--inset);border:1px solid var(--line2);color:var(--accent);box-shadow:inset 0 0 12px color-mix(in srgb,var(--accent) 12%,transparent)}
.icobox svg{width:20px;height:20px}
.wizcta{margin:14px 0 4px;border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent),0 6px 22px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
.wizcta .icobox{background:linear-gradient(160deg,var(--accent),var(--accent-deep));border-color:transparent;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--accent) 50%,transparent)}
/* segmented readouts */
.pill{font:700 12px var(--mono);color:var(--amber);border:1px solid var(--line2);background:var(--inset);border-radius:5px;padding:3px 9px;flex-shrink:0;letter-spacing:.04em}
.count{font:700 13px var(--mono);color:var(--amber);border:1px solid var(--line2);background:var(--inset);border-radius:5px;padding:3px 10px;flex-shrink:0;letter-spacing:.08em;text-shadow:0 0 8px color-mix(in srgb,var(--amber) 45%,transparent)}

/* ============ hero plate (instrument panel) ============ */
.plate{border:1px solid var(--line2);border-radius:var(--r);padding:20px 18px;background:linear-gradient(180deg,var(--panel),var(--panel2));position:relative;overflow:hidden;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accent) 18%,transparent)}
.plate::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--ink) 3%,transparent) 3px 4px)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 85% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 55%)}
.plate>*{position:relative;z-index:1}
.plate h1{font-size:24px;font-weight:800;letter-spacing:-.015em;margin:8px 0 12px;line-height:1.2}
.specs{display:flex;flex-wrap:wrap;gap:8px}

/* ============ value chips (HMI readout style) ============ */
.vchip{display:inline-flex;align-items:baseline;gap:6px;font:700 13px var(--mono);color:var(--amber);background:var(--inset);border:1px solid var(--line2);border-radius:5px;padding:5px 10px;text-shadow:0 0 8px color-mix(in srgb,var(--amber) 40%,transparent)}
.vchip .vl{font-size:9.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-shadow:none}

/* ============ search ============ */
.search{width:100%;background:var(--inset);border:1px solid var(--line2);border-radius:var(--r-sm);padding:13px 15px;font:16px var(--sans);color:var(--ink)}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.hint{font:11px var(--mono);color:var(--muted);margin-top:8px;letter-spacing:.06em}

/* ============ raise / lower — gauge panels ============ */
.rl{display:grid;gap:10px;margin-top:14px}
@media(min-width:560px){.rl{grid-template-columns:1fr 1fr}}
.rlp{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 14px 8px;border-left:3px solid var(--c);overflow:hidden}
.rlp .rlh{display:flex;align-items:center;gap:8px;color:var(--c);margin:0 -14px 8px;padding:9px 14px;background:color-mix(in srgb,var(--c) 12%,transparent);border-bottom:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.rlp .glyph{font:800 15px var(--mono)}
.rlp .rll{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.rlp ul{margin:0;padding:6px 0 6px 18px}
.rlp li{font-size:14px;line-height:1.5;margin:7px 0;color:var(--ink)}
.rlp li::marker{color:var(--c)}
.raise{--c:var(--raise)}.lower{--c:var(--lower)}

/* ============ callouts (alarm banners) ============ */
.callout{border:1px solid;border-left-width:3px;border-radius:var(--r-sm);padding:12px 14px;margin-top:14px;font-size:14.2px;line-height:1.55}
.callout .ct{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.callout .ct::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.co-warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.co-warn .ct{color:var(--warn)}
.co-amber{border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 9%,transparent)}
.co-amber .ct{color:var(--amber)}
.co-ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.co-ok .ct{color:var(--ok)}
.co-info{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.co-info .ct{color:var(--accent)}
.callout ul{margin:4px 0 0;padding-left:18px}
.callout li{margin:4px 0}

/* ============ chips (HMI tags) ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
a.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--inset);border-radius:5px;padding:7px 12px;font-size:13.5px;font-weight:550;transition:border-color .15s,color .15s,box-shadow .15s}
a.chip:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.chip .ck{font:700 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:4px;padding:4px 10px;font:12.5px var(--mono);color:var(--muted);background:var(--inset)}

/* ============ sections in detail pages ============ */
.sect{margin-top:20px}
.sect .eyebrow{display:block;margin-bottom:8px}
.sect p{margin:0;font-size:14.6px}

/* ============ cause cards ============ */
.cause{display:flex;gap:12px;padding:14px}
.cnum{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line2);border-radius:5px;background:var(--inset);font:800 13px var(--mono);color:var(--accent);box-shadow:0 0 10px -2px color-mix(in srgb,var(--accent) 45%,transparent)}
.cause .cc{min-width:0}
.cause .ct1{font-size:14.8px;font-weight:700;line-height:1.35}
.cause .cfix{font-size:14px;margin-top:5px;line-height:1.5}
.cause .cfix b{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-right:6px}
.cause .chips{margin-top:9px}
.cause .chips a.chip{padding:5px 10px;font-size:12.5px}

/* ============ ordered steps ============ */
ol.steps{margin:8px 0 0;padding-left:22px}
ol.steps li{font-size:14.6px;margin:9px 0;line-height:1.55}
ol.steps li::marker{font:700 13px var(--mono);color:var(--accent)}

/* ============ guide prose ============ */
.prose p{font-size:15.4px;line-height:1.68;margin:14px 0}
.prose p:first-child{margin-top:10px}

/* misc */
.spacer{height:8px}
.foot{margin-top:34px;text-align:center;font:11px var(--mono);color:var(--muted);letter-spacing:.06em}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14.5px}
mark{background:none;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header id="topbar">
  <div class="topbar-in">
    <button class="iconbtn" id="backBtn" aria-label="Back" hidden></button>
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-mark">SE</span>
      <span class="brand-txt">
        <span class="brand-name">IMM Guide</span>
        <span class="brand-sub"><span class="led led-live"></span>SE180EV &middot; ONLINE</span>
      </span>
    </a>
    <button class="iconbtn" id="searchBtn" aria-label="Search"></button>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme"></button>
  </div>
</header>

<main><div id="view" class="view" role="main"></div></main>

<nav id="tabbar" aria-label="Sections"><div class="tabbar-in" id="tabs"></div></nav>

<script>
window.APP_DATA = {"settings":[{"id":"fill_stage_select","screen":"Plast","group":"Injection / Fill","name":"Fill Stages (e.g. 2V-2P)","alsoCalled":["injection profile","stage select"],"units":"stages","whatItIs":"How many velocity-controlled stages (V) the fill uses and how many pressure-controlled stages (P) the pack/hold uses. 2V-2P means two fill speeds and two hold pressures.","raiseEffects":["Finer control of the flow front as it moves through geometry changes (slow through the gate, fast through thin walls, slow at the very end for venting)","Lets you fix defects tied to one spot on the part without changing the whole fill","More numbers to manage — harder to keep the process simple and transferable"],"lowerEffects":["Simpler, easier-to-repeat process that transfers between machines cleanly","Less ability to fix a defect that only happens at one point in fill (jetting at the gate, burn at end of fill)"],"typicalRange":"Most parts run well on 1-3 velocity stages. Add a stage only to fix a specific defect at a specific location — not by default.","relatedDefects":["jetting","burn_marks","gate_blush","flow_lines"],"cautions":"Every added stage is another thing that can drift. If a stage break isn't earning its keep, remove it.","interactsWith":["fill_velocity","fill_stage_positions","vp_transfer_position"]},{"id":"fill_velocity","screen":"Plast","group":"Injection / Fill","name":"Fill Velocity (per stage)","alsoCalled":["injection speed","Vel."],"units":"mm/sec","whatItIs":"How fast the screw drives forward during fill. This is the single most influential fill setting: speed sets shear rate, shear rate sets the melt's effective viscosity (plastics shear-thin), and viscosity decides how the flow front behaves.","raiseEffects":["Melt shear-thins — flows easier into thin walls and long flow paths","Hotter, faster flow front — stronger and less visible weld lines, better gloss and surface replication","Shorter fill time, higher fill peak pressure","Too fast: burn marks (dieseling) at end of fill or in trapped-gas corners, jetting at the gate, gate blush, flash if tonnage is marginal, gas has no time to escape the vents"],"lowerEffects":["Gentler shear, less gate stress, gas gets time to vent","Too slow: short shots, cold flow front — weak/visible weld lines, flow lines and record grooves, hesitation marks where flow pauses, dull gloss, front can freeze off in thin sections"],"typicalRange":"Scientific-molding default is 'fill as fast as the part allows.' Set it with a viscosity-curve study: run fill-only shots across speeds and pick a speed on the flat part of the curve, where small speed changes stop changing viscosity.","relatedDefects":["short_shot","burn_marks","jetting","weld_lines","flow_lines","gate_blush","flash","gloss_variation"],"cautions":"Watch Fill Peak vs. the fill pressure limit. If actual pressure flatlines at the limit, the machine is no longer holding your set speed ('pressure-limited fill') and the velocity numbers on screen are a lie.","interactsWith":["vp_transfer_position","fill_pressure_limit","clamp_force"]},{"id":"fill_stage_positions","screen":"Plast","group":"Injection / Fill","name":"Fill Stage Positions","alsoCalled":["velocity change-over points","Pos."],"units":"mm (screw position, counting down toward zero)","whatItIs":"The screw positions where fill switches from one velocity stage to the next. On this control the number counts down as the screw moves forward, so a larger position = earlier in fill.","raiseEffects":["That stage's speed hands off earlier — the next stage covers more of the part"],"lowerEffects":["That stage's speed runs longer into the fill before handing off"],"typicalRange":"Put stage breaks at real geometry events: just past the gate, entering a thin wall, or the last ~10% of fill if you need a slow finish for venting. Don't scatter breaks arbitrarily.","relatedDefects":["jetting","burn_marks","flow_lines"],"cautions":"If you change shot size (dose position), re-check that your stage breaks still line up with the same points on the part.","interactsWith":["fill_velocity","dose_position","vp_transfer_position"]},{"id":"vp_transfer_position","screen":"Plast","group":"Injection / Fill","name":"V-P Transfer Position","alsoCalled":["cutover","transfer position","V-P Pos"],"units":"mm (screw position)","whatItIs":"The screw position where the machine switches from velocity-controlled fill to pressure-controlled pack/hold. The most important single switch point in the whole process — it decides how full the cavity is when hold pressure takes over.","raiseEffects":["Transfers EARLIER (screw further back) — cavity is less full when hold takes over","Hold pressure has to finish filling: safer against flash and overpack","Too early: hold can't finish the part — short shots, sinks and unpacked areas at end of fill, weight drops"],"lowerEffects":["Transfers LATER — cavity is more full on velocity","Too late: flash, overpacking, pressure spike at transfer, stress in the gate area, and it can crush your cushion toward zero — risks mold damage"],"typicalRange":"Set so the part is ~95-98% full at transfer. Prove it with a fill-only study: kill hold pressure/time and adjust V-P until the fill-only part is just short by design, then restore hold.","relatedDefects":["short_shot","flash","sink_marks","burn_marks","dimensional_drift"],"cautions":"Never let transfer happen with the screw near bottom — no cushion means no pressure transmission and a beat-up machine. Re-check V-P any time you change shot size.","relatedActuals":["min_cushion","fill_peak","fill_time"],"interactsWith":["dose_position","hold_pressure","fill_velocity"]},{"id":"fill_pressure_limit","screen":"Plast","group":"Injection / Fill","name":"Maximum Filling Pressure","alsoCalled":["fill pressure limit","injection pressure limit","[J2P1P010] on your screen"],"units":"kgf/cm2","whatItIs":"A ceiling on injection pressure during velocity-controlled fill. It is a safety limit, not a target — during proper fill the machine uses whatever pressure it needs (up to this cap) to hold your set speed.","raiseEffects":["More headroom — the machine can hold set velocity even when viscosity drifts (new lot, colder melt, regrind swings)","No change to the running process unless the old limit was actually being hit"],"lowerEffects":["If set below what fill really needs, fill goes 'pressure-limited': actual speed sags, fill time stretches and wanders shot to shot, short shots and inconsistency appear","Deliberately lowered on purpose only to protect fragile tooling, thin cores, or during mold trials"],"typicalRange":"Set 10-20% above the observed Fill Peak once the process is stable. Example from your screen: Fill Peak 1554 with a 1680 limit is only ~8% headroom — workable, but a viscosity swing could clip it.","relatedDefects":["short_shot","dimensional_drift"],"cautions":"If fill time starts varying and Fill Peak is flatlined at the limit, fix this before touching anything else — nothing else you adjust is in control until velocity is back in control.","relatedActuals":["fill_peak","fill_time"],"interactsWith":["fill_velocity"]},{"id":"fill_time_limit","screen":"Plast","group":"Injection / Fill","name":"Fill Time Limit","alsoCalled":["Fill T.Limit","fill watchdog"],"units":"sec","whatItIs":"A watchdog: the maximum time the machine allows to reach V-P transfer before it alarms. Catches real failures — empty hopper, blocked nozzle or gate, dead check ring — before they wreck parts or the tool.","raiseEffects":["More tolerance before alarming — fewer nuisance trips, but slower to catch a genuine problem"],"lowerEffects":["Catches problems fast; too tight and normal shot-to-shot variation trips nuisance alarms"],"typicalRange":"A few multiples of actual fill time. Your screen: 0.131 sec actual with a 1.000 sec limit — loose but sane. Tight enough to catch a blocked gate, loose enough to ignore normal variation.","relatedDefects":["short_shot"],"cautions":"If this alarm fires repeatedly, treat it as a symptom — check material feed, nozzle, and check ring. Don't just widen the limit.","interactsWith":["fill_velocity","fill_pressure_limit"]},{"id":"flow_check","screen":"Plast","group":"Injection / Fill","name":"Flow-Check","alsoCalled":["check ring monitor","non-return valve check"],"units":"mm (ON/OFF + threshold)","whatItIs":"A Sumitomo monitoring function that watches for melt leaking back past the check ring (non-return valve) by measuring screw movement it shouldn't be making. A worn check ring is the classic hidden cause of drifting cushion and random shorts.","raiseEffects":["Looser threshold — tolerates more leakage before flagging; catches only badly worn rings"],"lowerEffects":["Tighter threshold — flags check-ring wear earlier; too tight can nuisance-trip on normal seating variation"],"typicalRange":"Yours is OFF. Worth turning on for critical jobs: it turns 'why is cushion wandering?' from a mystery into a flagged maintenance item.","relatedDefects":["short_shot","sink_marks","dimensional_drift"],"cautions":"Behavior/threshold convention marked to-verify against the SE-EV manual — confirm before trusting specific numbers in this entry.","relatedActuals":["min_cushion"],"interactsWith":["vp_transfer_position","dose_position"]},{"id":"hold_pressure","screen":"Plast","group":"Hold / Pack (H.Press)","name":"Hold Pressure (1st / 2nd)","alsoCalled":["pack pressure","H.Press","holding pressure"],"units":"kgf/cm2","whatItIs":"The pressure applied after V-P transfer that finishes filling the last few percent, packs the cavity against shrinkage, and holds melt in until the gate freezes. This is the setting that owns part weight, dimensions, and sinks.","raiseEffects":["Heavier part, fewer sinks and internal voids, dimensions grow (less shrinkage), sharper surface detail","Too high: flash, overpacked stress near the gate (warp, cracking, stress whitening), parts stick in the cavity, ejection gets violent, needed clamp tonnage climbs"],"lowerEffects":["Lighter part, more shrinkage — sinks over ribs and bosses, voids in thick sections, dimensions come in smaller","Far ends of the part and thin details go unpacked first"],"typicalRange":"Common starting point is roughly 50-75% of Fill Peak, then dial by part weight and dimensions. A lower 2nd stage tapers pressure to ease gate stress as the gate freezes.","relatedDefects":["sink_marks","voids","flash","warpage","sticking","dimensional_drift","cracking"],"cautions":"Hold pressure only works while the gate is open — if dimensions won't respond, the gate may already be frozen (see Hold Time) or the cushion may be collapsing (see Dose Position).","relatedActuals":["pack_p","min_cushion","clamp_f_hold_end"],"interactsWith":["hold_time","vp_transfer_position","cool_time","clamp_force"]},{"id":"hold_time","screen":"Plast","group":"Hold / Pack (H.Press)","name":"Hold Time (1st / 2nd)","alsoCalled":["pack time","holding time"],"units":"sec","whatItIs":"How long hold pressure stays applied. It only does work until the gate freezes shut — after gate seal, extra hold time changes nothing except your cycle time.","raiseEffects":["More packing up until gate seal: heavier part, fewer sinks, steadier dimensions","Past gate seal: zero effect on the part, pure wasted cycle time"],"lowerEffects":["Cut it below gate seal and packed material discharges back out through the still-open gate: sinks, voids, part-weight scatter, dimensional drift"],"typicalRange":"Set with a gate-seal study: raise hold time in steps, weigh parts each step, and find where weight plateaus. Run just past the plateau. Weight still climbing = gate still open = you're leaving pack on the table.","relatedDefects":["sink_marks","voids","dimensional_drift"],"cautions":"Gate seal time changes with melt temp, mold temp, and gate size — re-verify after any of those change.","interactsWith":["hold_pressure","cool_time"]},{"id":"hold_velocity_limit","screen":"Plast","group":"Hold / Pack (H.Press)","name":"H.V. Limit (Hold Velocity Limit)","alsoCalled":["hold speed limit"],"units":"mm/sec","whatItIs":"The maximum forward speed the screw may move during hold while chasing the hold-pressure setpoint. It softens the handoff from velocity control to pressure control so the transfer doesn't spike.","raiseEffects":["Pressure builds faster right at transfer — snappier packing response","Too high with a nearly-full cavity: pressure overshoot and a flash spike at transfer"],"lowerEffects":["Gentler, spike-free transfer","Too low: the screw physically can't move fast enough to reach the set hold pressure — you get sinks even though the hold numbers 'look right'"],"typicalRange":"A big step down from fill speed is normal — your screen runs fill at 175 mm/sec and H.V. Limit at 22 mm/sec.","relatedDefects":["flash","sink_marks"],"cautions":"If actual Pack P. never reaches your set hold pressure, check this before blaming the hold setting itself.","relatedActuals":["pack_p","all_peak"],"interactsWith":["hold_pressure","vp_transfer_position"]},{"id":"hold_return_velocity","screen":"Plast","group":"Hold / Pack (H.Press)","name":"Ret Vel (Return Velocity after Hold)","alsoCalled":["post-hold retract"],"units":"mm/sec (OFF or a speed)","whatItIs":"An optional controlled screw retract immediately after hold ends, before dosing starts. It bleeds off residual melt pressure so recovery starts from a consistent, relaxed state.","raiseEffects":["Faster pressure relief between hold and dose; can calm nozzle drool and make dose start more repeatable"],"lowerEffects":["OFF (like your screen): dosing starts against whatever residual pressure is left — usually fine, and one less setting in play"],"typicalRange":"Most processes run this OFF and manage decompression with the pull-back settings instead. Turn it on only to solve a specific dose-start or drool problem.","relatedDefects":["drooling","stringing"],"cautions":"Its job overlaps with pre-dose Pull Back — use one or the other deliberately, not both blindly.","interactsWith":["pull_back_before_dose","pull_back_after_dose"]},{"id":"dose_position","screen":"Plast","group":"Dose / Plasticizing","name":"Dose End Position (Shot Size)","alsoCalled":["shot size","charge position","dose stroke"],"units":"mm (screw position)","whatItIs":"The screw position where dosing stops — this IS your shot size. It sets how much melt is in front of the screw for the next shot, and together with V-P it determines your cushion.","raiseEffects":["Bigger shot. With V-P unchanged, more material is injected before transfer — cavity runs fuller at transfer (flash/overpack risk) and cushion grows","More melt sitting in the barrel front each cycle (slightly more residence time)"],"lowerEffects":["Smaller shot — short shots appear, and cushion shrinks toward zero (once cushion is gone, hold pressure can't reach the part at all)"],"typicalRange":"Size the shot so cushion lands small but healthy and stable. Working rule: use Dose Position to place your cushion, use V-P to place how full the cavity is at transfer — don't fix one problem with the other's knob.","relatedDefects":["short_shot","flash","sink_marks"],"cautions":"Any change here shifts where every fill stage break lands on the part — re-check stage positions and V-P after moving shot size.","relatedActuals":["min_cushion","dose_time"],"interactsWith":["vp_transfer_position","fill_stage_positions","pull_back_after_dose"]},{"id":"screw_rpm","screen":"Plast","group":"Dose / Plasticizing","name":"Screw Rotation Speed (1st / End)","alsoCalled":["Rot.","recovery speed","screw speed"],"units":"rpm","whatItIs":"How fast the screw spins while recovering (dosing) the next shot. Rotation drags pellets forward and generates shear heat — it's a major contributor to real melt temperature, often more than people credit the heater bands for.","raiseEffects":["Shorter dose time","More shear heating — hotter melt than the barrel setpoints suggest","Hard on shear-sensitive and filled materials (glass fiber breakage, degradation, black specks over time)","Pushed too far: pellets race through without enough melting time — unmelts and inconsistent melt"],"lowerEffects":["Gentler, more uniform conductive melting; friendlier to shear-sensitive resins","Longer dose time — completely free as long as dosing still finishes inside the cooling window"],"typicalRange":"Best practice: the slowest RPM that finishes dosing comfortably within cooling time (dose time around 80% of the cooling window is a good target). Tapering the End stage RPM down gives a soft, repeatable dose stop.","relatedDefects":["splay","black_specks","unmelts","color_streaks","brittleness"],"cautions":"Free cycle-time hiding here: if dose finishes way before cooling ends, you can slow the screw down for better melt quality at zero cycle cost.","relatedActuals":["dose_time","screw_torq"],"interactsWith":["back_pressure","cool_time","dose_delay"]},{"id":"back_pressure","screen":"Plast","group":"Dose / Plasticizing","name":"Back Pressure (1st / End)","alsoCalled":["B.P."],"units":"kgf/cm2","whatItIs":"The resistance the screw must push against while it retracts during dosing. It works the melt: more back pressure squeezes and mixes the material harder as it's conveyed forward.","raiseEffects":["Better mixing and color dispersion, denser and more consistent melt (steadier part weights)","Squeezes out trapped air and volatiles","More shear heat (raises real melt temp) and longer dose time","Too high: degrades shear-sensitive resins, breaks glass fibers, overworks the dose servo on an all-electric"],"lowerEffects":["Faster, easier recovery, gentler on material","Too low: trapped air and unmelts ride forward, color swirls/streaks, shot-density scatter shows up as part-weight variation"],"typicalRange":"Low and steady wins — just enough for a consistent dose time and clean melt. Your screen runs 25/25 kgf/cm2, which is in sane low territory for most resins.","relatedDefects":["splay","unmelts","color_streaks","voids","dimensional_drift"],"cautions":"Back pressure is a melt-temperature knob in disguise. If you raise it meaningfully, expect the melt to run hotter even with unchanged barrel setpoints.","relatedActuals":["dose_time","screw_torq"],"interactsWith":["screw_rpm","barrel_temps"]},{"id":"pull_back_before_dose","screen":"Plast","group":"Dose / Plasticizing","name":"Pull Back — Before Dose","alsoCalled":["pre-dose decompression"],"units":"mm + mm/sec","whatItIs":"A small screw retract before rotation starts (yours: 0.50 mm at 25 mm/sec). It relieves leftover hold pressure so the screw starts recovery from a consistent, unloaded state instead of fighting residual pressure.","raiseEffects":["More pressure relief before dosing — can steady dose time and dose start on stubborn processes","Too much just adds stroke and time for no benefit"],"lowerEffects":["Dosing starts against residual pressure — usually fine; slightly less consistent recovery on some materials"],"typicalRange":"Small — a fraction of a millimeter to ~1 mm. Yours at 0.50 mm is textbook.","relatedDefects":["dimensional_drift"],"cautions":"Don't confuse this with the after-dose pull back — that one is the drool/stringing fix.","interactsWith":["hold_return_velocity","pull_back_after_dose"]},{"id":"pull_back_after_dose","screen":"Plast","group":"Dose / Plasticizing","name":"Pull Back — After Dose","alsoCalled":["suck back","decompression","the +mm field after dose"],"units":"mm + mm/sec","whatItIs":"After the shot is dosed, the screw pulls back a set distance without rotating (yours: 4.00 mm at 15 mm/sec). This decompresses the melt in front of the screw so it doesn't ooze out of the nozzle between cycles.","raiseEffects":["Less nozzle drool and gate stringing; relieves melt pressure before the mold opens","Too much: sucks air into the nozzle/melt front — splay and bubbles at the gate on the next shot, cold-slug problems, and cushion/first-stage inconsistency"],"lowerEffects":["Too little: drool from the nozzle, strings on parts and sprues, cold slugs that jam gates and leave surface defects"],"typicalRange":"As little as reliably stops the drool — creep it up in 0.5 mm steps only until stringing disappears, then stop.","relatedDefects":["drooling","stringing","splay","voids"],"cautions":"If splay shows up only at the gate and the material is verified dry, over-aggressive suck back pulling in air is a top suspect.","interactsWith":["dose_position","nozzle_temp","dose_delay"]},{"id":"dose_delay","screen":"Plast","group":"Dose / Plasticizing","name":"Dose Delay","alsoCalled":["recovery delay","charge delay"],"units":"sec","whatItIs":"A wait after hold ends before the screw starts rotating. It shifts dosing later inside the cooling window, so the prepared melt spends less time sitting hot in the barrel before it gets injected.","raiseEffects":["Fresher melt at injection — helps heat-sensitive resins and drool-prone setups","Too long: dosing no longer finishes inside cooling time and it starts stretching your cycle"],"lowerEffects":["Zero (like your screen): dosing starts immediately — standard for most jobs; melt simply waits a bit longer before the next shot"],"typicalRange":"Usually 0. Reach for it with heat-sensitive materials (POM, PVC, some flame-retardant grades) or hot-runner drool fights. Keep delay + dose time inside cooling time.","relatedDefects":["splay","black_specks","drooling","brittleness"],"cautions":"Check Dose Time after adding delay — if delay + dose now exceeds cooling, the machine waits on the screw and your cycle grows.","relatedActuals":["dose_time","cycle_time"],"interactsWith":["cool_time","screw_rpm"]},{"id":"cool_time","screen":"Plast","group":"Cooling & Cycle","name":"Cooling Time","alsoCalled":["Cool","cure time"],"units":"sec","whatItIs":"How long the mold stays clamped after hold ends while the part solidifies. Dosing happens during this window, so cooling time is 'free' screw-recovery time too.","raiseEffects":["Part ejects stiffer and cooler: less warp and distortion, fewer ejector push marks, steadier dimensions, less post-mold shrink surprise","Directly longer cycle — this is usually the biggest single block of cycle time"],"lowerEffects":["Shorter cycle","Too short: hot floppy parts — warp, ejector pins punch or drag, parts stick or hang, dimensions wander for hours after molding"],"typicalRange":"Driven by the thickest wall section. Hard floor: cooling must exceed dose time (+ dose delay) with margin, or dosing sets your cycle instead of cooling. Your screen: 1.2 sec cooling vs 0.67 sec dose — fits, thin margin.","relatedDefects":["warpage","ejector_marks","dimensional_drift","sticking"],"cautions":"Chasing cycle time by cutting cooling is the classic false economy — you pay it back in warp scrap and dimensional complaints.","relatedActuals":["dose_time","cycle_time"],"interactsWith":["hold_time","screw_rpm","dose_delay","mold_temp"]},{"id":"interval_time","screen":"Plast","group":"Cooling & Cycle","name":"Interval Time","alsoCalled":["cycle interval","pause time"],"units":"sec","whatItIs":"A deliberate pause between cycles (around mold-open) before the next cycle starts. Used for operator part removal in semi-auto, insert loading, or intentionally slowing a cycle.","raiseEffects":["More open time between cycles; also cools the melt sitting in the barrel longer (can matter for heat-sensitive resins — in either direction)"],"lowerEffects":["Tighter cycle; 0 (like your screen) is standard for full-auto"],"typicalRange":"0 in full-auto. Anything else should have a reason written on the setup sheet.","relatedDefects":["black_specks","splay"],"cautions":"Inconsistent manual intervals in semi-auto = inconsistent melt residence = inconsistent parts. If semi-auto parts vary and auto parts don't, this is why.","interactsWith":["cool_time","dose_delay"]},{"id":"clamp_force","screen":"Plast","group":"Clamp","name":"Clamp Force Setting","alsoCalled":["tonnage","Clamp F"],"units":"TF (tons)","whatItIs":"How hard the machine squeezes the mold halves together to resist cavity pressure during fill and pack. Too little and the mold blows open at the parting line; too much and you crush your own vents.","raiseEffects":["More resistance to flash at the parting line","Too high: vents crush shut — trapped gas causes burns and shorts (yes, too MUCH tonnage causes shorts), platen/mold stress, accelerated tool wear, wasted energy"],"lowerEffects":["Vents breathe better (fewer burns, cleaner fills at end of flow), gentler on the tool","Too low: flash at the parting line, especially at the moment of V-P transfer"],"typicalRange":"Rule of thumb 2-5 tons per square inch of projected part area, but the modern method is: find the lowest tonnage that doesn't flash, then add a small margin. Your screen shows the machine computed a minimum of ~14-15 TF while set at 100 TF — worth a low-tonnage trial; there may be venting and mold-life gains sitting there.","relatedDefects":["flash","burn_marks","short_shot"],"cautions":"Watch Peak Clamp on the Actual display — if peak tonnage rises above setpoint during injection, the cavity pressure is bending things and either tonnage or pack aggression needs attention.","relatedActuals":["peak_clamp","clamp_f_hold_end"],"interactsWith":["hold_pressure","fill_velocity","auto_clamp_correction"]},{"id":"auto_clamp_correction","screen":"Plast","group":"Clamp","name":"Full Auto Clamp Force Correction","alsoCalled":["auto tonnage correction"],"units":"ON/OFF","whatItIs":"A Sumitomo function that monitors actual clamp force and automatically re-corrects it as the mold and toggle grow with heat. Without it, tonnage drifts as everything warms up through the shift.","raiseEffects":["ON (like your screen): tonnage stays at setpoint from cold start to full thermal soak — no morning-vs-afternoon flash mysteries, and it protects the toggle from thermal-expansion overload"],"lowerEffects":["OFF: tonnage wanders with temperature — a mold that vents fine at 7 AM can flash or burn by noon, and thermal growth can silently over-tonnage the machine"],"typicalRange":"Leave ON for production. The Min. Clamp F. Value readout (14-15 TF on yours) is the machine telling you the computed floor it will correct against.","relatedDefects":["flash","burn_marks","dimensional_drift"],"cautions":"If this faults or fights you, check tie-bar/mold parallelism and mold-height setup before disabling it — it's usually reporting a real mechanical issue.","relatedActuals":["clamp_force_actual","peak_clamp"],"interactsWith":["clamp_force"]},{"id":"mold_open_profile","screen":"Mold","group":"Mold Open / Close","name":"Mold Open Positions & Speeds","alsoCalled":["open profile","Open Limit / 2nd / 1st"],"units":"mm + %","whatItIs":"Multi-stage mold opening: slow breakaway from the parting line (1st), fast travel through the middle (2nd), and a controlled stop at the open limit. Your screen runs 3 stages ending at an 80.0 mm open limit.","raiseEffects":["Higher speeds: shorter dry-cycle time — mold open/close is often easy cycle time to win","Larger open limit: more room for part drop or robot entry, but longer travel every cycle"],"lowerEffects":["Slower breakaway (1st stage): gentler release of the part off cores — helps parts that drag, stick, or show stress marks at opening","Smaller open limit: faster cycle; too small and parts or the picker clash with the mold"],"typicalRange":"Slow for the first few mm off the parting line, fast through the middle, decelerate to the stop. Open only as far as part removal actually needs.","relatedDefects":["sticking","cracking","ejector_marks"],"cautions":"A violent breakaway can crack parts still gripping a core — if cracks appear near opening, slow the 1st stage before touching the process.","interactsWith":["mold_close_profile","ejector_stroke","cool_time"]},{"id":"mold_close_profile","screen":"Mold","group":"Mold Open / Close","name":"Mold Close Positions & Speeds","alsoCalled":["close profile","Close 1st / 2nd / Clamp"],"units":"mm + %","whatItIs":"Multi-stage closing: fast travel while the halves are far apart, slowing down as they approach, then the low-pressure protect zone and final clamp-up. Your screen: fast to 50.0, fast to 10.0, protect/clamp from 1.19 mm.","raiseEffects":["Higher speeds: faster cycle","Switching to slow later (lower position numbers): more of the travel runs fast — cycle drops, but less reaction distance before the faces meet"],"lowerEffects":["Switching to slow earlier: more gentle approach and more distance for mold protect to catch an obstruction — safer for the tool, slightly longer cycle"],"typicalRange":"Fast until the last ~10 mm, then slow into the protect zone. Never let the halves touch at speed.","relatedDefects":[],"cautions":"The slow-down point and the mold-protect window work together — if you speed up the approach, re-verify protect still has room to react.","interactsWith":["mold_protect","clamp_force"]},{"id":"mold_protect","screen":"Mold","group":"Mold Open / Close","name":"Low-Pressure Mold Protect","alsoCalled":["Lw Clamp","mold protection","low pressure close"],"units":"mm start position + % pressure","whatItIs":"The tool-saving zone: from a set position (yours: 20.0 mm) the mold closes with limited force (yours: 40%) so that a stuck part, dropped runner, or cold slug on the face stalls the machine instead of being crushed into the steel. The cheapest insurance on the whole press.","raiseEffects":["Higher start position: protection begins earlier — covers taller hang-ups (a full part standing on the face), adds a little close time","Higher protect pressure: pushes through more resistance before tripping — fewer nuisance stops, but a real obstruction gets squeezed harder before the machine gives up"],"lowerEffects":["Lower pressure: trips at the slightest resistance — maximum tool protection, but may nuisance-trip on tight leader pins or heavy molds","Start position too low: a part taller than the window gets hit at full speed before protection ever engages"],"typicalRange":"Start the window just above the tallest thing that could ever be left on the mold face, with the lowest pressure that reliably closes an empty mold. Verify after every mold change.","relatedDefects":[],"cautions":"If mold protect trips, never fix it by raising the pressure until you have physically looked at both mold faces. Crushed inserts and smashed pins are how molds die.","interactsWith":["mold_close_profile","ejector_count_delay","clamp_force"]},{"id":"ejector_stroke","screen":"Mold","group":"Ejector","name":"Ejector Positions (Stroke)","alsoCalled":["eject position","1st / Eject Pos"],"units":"mm","whatItIs":"How far the ejector plate travels forward to push parts off the cores. Your screen: 0.80 mm first stage, 1.40 mm full eject.","raiseEffects":["More push — parts that hang halfway get fully cleared","Too far: pins can over-travel, punch through hot parts, or over-stress the ejector plate on its stops"],"lowerEffects":["Gentler, faster ejection; too short and parts don't fully release — hangers cause mold-protect trips and double-clamped parts"],"typicalRange":"Just enough travel to reliably clear the part off every core, plus a small margin. More stroke is not more reliable — it's just more wear.","relatedDefects":["sticking","ejector_marks"],"cautions":"A part left hanging after ejection is the #1 cause of mold protect trips — if trips start, watch ejection with your own eyes before changing anything.","interactsWith":["ejector_speed_pressure","ejector_count_delay","cool_time"]},{"id":"ejector_speed_pressure","screen":"Mold","group":"Ejector","name":"Ejector Velocity & Pressure","alsoCalled":["eject speed","Vel. / Press."],"units":"% (yours: 25 vel / 40 press)","whatItIs":"How fast and how hard the ejector plate drives forward. Speed controls how violently pins hit the part; pressure controls how much resistance they can push through.","raiseEffects":["Faster part clearance, shorter cycle","Too fast/hard: pin push marks, stress whitening rings around pins, cracked bosses, parts launched instead of dropped"],"lowerEffects":["Gentle ejection — kind to soft or cosmetic parts","Too low: plate stalls against sticking force and parts hang"],"typicalRange":"Slowest and softest that clears the part every single shot. If you need high ejector force to free parts, the real problem is upstream: overpacking, short cooling, or tool polish/draft.","relatedDefects":["ejector_marks","cracking","sticking"],"cautions":"Rising ejection force needed over a run is a symptom — check hold pressure creep, cooling water, and core condition rather than just turning ejection up.","interactsWith":["ejector_stroke","hold_pressure","cool_time"]},{"id":"ejector_count_delay","screen":"Mold","group":"Ejector","name":"Ejector Count, Mode & Delay","alsoCalled":["multi-eject","shake","eject delay"],"units":"count + sec (yours: 1 count, 0.00 delay, Normal mode)","whatItIs":"How many times the ejector strokes per cycle, the ejection mode, and any wait before ejecting after the mold opens.","raiseEffects":["More counts: a shake action that rattles clingy parts loose — useful for parts that ride the pins back","More delay: lets the part cool/shrink a moment on the open core before pushing, or times ejection to a robot"],"lowerEffects":["Single stroke, zero delay (yours): fastest and simplest — the right default when parts drop cleanly"],"typicalRange":"1 count, 0 delay unless a specific sticking problem says otherwise. Every extra count is cycle time and pin wear.","relatedDefects":["sticking"],"cautions":"If you need 3 counts to free a part, that's a band-aid — look at packing, cooling, draft, and polish for the real fix.","interactsWith":["ejector_stroke","ejector_speed_pressure"]},{"id":"barrel_temps","screen":"Temperature","group":"Heats","name":"Barrel Zone Temperatures","alsoCalled":["heats","zone temps","temperature profile"],"units":"deg C / deg F per zone","whatItIs":"The heater band setpoints along the barrel, rear (feed end) to front (nozzle end). They set the baseline melt temperature — but remember screw RPM and back pressure add shear heat on top, so real melt temp is usually hotter than the front zone says.","raiseEffects":["Easier flow (lower viscosity): helps short shots, weld lines, gloss, thin-wall fill","Too hot: degradation — splay, black specks, brittleness, drool, gassing, longer cooling needed, more shrink to pack out"],"lowerEffects":["Stiffer melt: less flash and drool, less degradation risk, faster setup of the part","Too cold: short shots, unmelts, weak weld lines, high fill pressures, delamination, machine strains to fill"],"typicalRange":"Start at the resin supplier's datasheet mid-range with a rising rear-to-front profile (reverse profiles exist for special cases). Verify with an actual melt purge temperature, not just the setpoints.","relatedDefects":["splay","black_specks","short_shot","weld_lines","brittleness","unmelts","flash","delamination"],"cautions":"Barrel changes take 10-15+ minutes to truly soak through — judge nothing until temps have settled. Never rotate the screw until every zone is at setpoint and soaked (torque overload / broken screws live here).","interactsWith":["screw_rpm","back_pressure","nozzle_temp","cool_time"]},{"id":"nozzle_temp","screen":"Temperature","group":"Heats","name":"Nozzle Temperature","alsoCalled":["tip temp"],"units":"deg C / deg F","whatItIs":"The heater on the nozzle tip — the last thing melt touches before the mold. It fights a cold sprue bushing pressed against it, so it lives in a tug-of-war between drooling (too hot) and freezing off (too cold).","raiseEffects":["No freeze-off, free-flowing tip","Too hot: drool between shots, stringing, splay from material sitting hot in the tip"],"lowerEffects":["Less drool and stringing","Too cold: cold slugs (blemish at the gate, jetting seed, blocked gates), nozzle freeze-off, fill-time alarms"],"typicalRange":"Usually at or slightly below the front barrel zone. Tune in small steps against the drool-vs-freeze symptoms, alongside suck back.","relatedDefects":["drooling","stringing","jetting","splay","short_shot"],"cautions":"A nozzle thermocouple reading the heater band instead of the melt can lie by a lot — if symptoms don't match the number, suspect the sensor placement.","interactsWith":["pull_back_after_dose","barrel_temps","dose_delay"]},{"id":"feed_throat_temp","screen":"Temperature","group":"Heats","name":"Feed Throat Temperature","alsoCalled":["hopper throat","feed zone cooling"],"units":"deg C / deg F (water-cooled)","whatItIs":"The cooled zone under the hopper where pellets enter. It must stay cool enough that pellets don't get sticky and bridge before the screw grabs them.","raiseEffects":["Too warm: pellets soften and bridge in the throat — feed starves, dose times stretch and wander, then 'dose not complete' alarms"],"lowerEffects":["Reliable, consistent feeding; very cold can condense moisture onto pellets in humid shops"],"typicalRange":"Warm to the touch, never hot. If dose time drifts long over a shift, put a hand near the throat before blaming the screw.","relatedDefects":["short_shot","splay","dimensional_drift"],"cautions":"Throat cooling water gets forgotten — a closed valve here looks exactly like a material or screw problem two hours later.","interactsWith":["barrel_temps","screw_rpm"]},{"id":"mold_temp","screen":"Temperature","group":"Mold (external TCU)","name":"Mold Temperature","alsoCalled":["tool temp","water temp","TCU setpoint"],"units":"deg C / deg F","whatItIs":"Set on the water unit (TCU), not this control — but it drives more part quality than almost anything on the screen. It sets how fast the skin freezes, which controls surface finish, weld lines, packing window, warp, and dimensions.","raiseEffects":["Better gloss and surface replication, stronger weld lines, longer gate-open window for packing, lower molded-in stress, dimensions closer to steel","Costs cycle time (slower cooling); too hot: sticking, sinks reappear, ejection distortion"],"lowerEffects":["Faster cycles, parts set up quick","Too cold: dull finish, visible weld/flow lines, high stress (warp and cracking later), gate seals early so packing stops working"],"typicalRange":"Datasheet range for the resin — and verify with a pyrometer on the steel, because the TCU display is water temp, not mold surface temp. Unbalanced halves (hot cavity, cold core or vice versa) is a top warp cause.","relatedDefects":["warpage","weld_lines","gloss_variation","sink_marks","sticking","flow_lines","cracking","dimensional_drift"],"cautions":"Check actual flow, not just temperature — a half-plugged circuit at the right temp still cools unevenly and warps parts.","interactsWith":["cool_time","hold_time","hold_pressure","barrel_temps"]}],"actuals":[{"id":"min_cushion","name":"Min Cushion","yourScreen":"4.81 mm","whatItTells":"The smallest amount of melt left in front of the screw during hold — your pressure-transmission reserve. With a cushion, hold pressure reaches the part; with zero cushion, the screw is bottomed out and hold pressure goes into steel, not plastic. The single most important consistency number on the machine.","healthy":"Small, stable, and never zero. A few mm that repeats within a few hundredths shot after shot.","rising":"More material left over: check ring seating better than before, viscosity up (colder melt, new lot), or shot size crept up. Parts may trend heavy/flashy.","falling":"Losing your reserve: check ring leaking (the classic), shot size too small, hotter/thinner melt, or V-P transfer moved. Falling toward zero = sinks, shorts, and dimensional drift incoming.","checkFirst":["Trend over 20 shots — steady, drifting, or jumping?","Dose position and V-P unchanged?","If it wanders randomly: suspect the check ring (run Flow-Check / a static leak test)"]},{"id":"hold_end","name":"Hold End Position","yourScreen":"4.81 mm","whatItTells":"Where the screw stopped when hold finished. On a well-behaved process it equals Min Cushion (yours match at 4.81) — the screw crept forward during hold and stayed.","healthy":"Matches Min Cushion and repeats tightly.","rising":"Screw finishing further back — packing less material in: gate freezing earlier, hold pressure not achieved, or viscosity up.","falling":"Screw finishing deeper — gate staying open longer or thinner melt letting more material pack in. Watch for flash and heavy parts.","checkFirst":["Compare with Min Cushion — a gap between them means backflow during hold (check ring)","Did melt or mold temp change?"]},{"id":"fill_start_pos","name":"Fill Start Position","yourScreen":"26.02 mm","whatItTells":"Where the screw actually sat when injection began. It should equal dose position + after-dose pull back (yours: 22.00 + 4.00 = 26.0 — checks out). It's a free health check that dosing and decompression did what they were told.","healthy":"Matches the math above within a few hundredths, every shot.","rising":"Screw starting further back than commanded — over-travel on dose stop or drift in pull back.","falling":"Starting short — melt pressure pushing the screw forward after decompression (drooling out the nozzle), or dose stopping early.","checkFirst":["Does dose pos + pull back = this number?","If it wanders: watch the nozzle for drool between cycles"]},{"id":"fill_time","name":"Fill Time","yourScreen":"0.131 sec","whatItTells":"How long velocity-controlled fill took to reach V-P transfer. Under true velocity control this barely moves — so any variation means the machine could NOT hold your set speed, which makes fill time the best single 'is my fill in control?' number.","healthy":"Repeats within a few thousandths of a second.","rising":"Fill slowing down: pressure-limited (Fill Peak flat at the limit), viscosity up, restriction growing (cold slug, plugged gate/vent), or check ring leaking during fill.","falling":"Filling easier: hotter/thinner melt, or less material ahead of the screw (short dose).","checkFirst":["Is Fill Peak sitting at the Maximum Filling Pressure limit? That's pressure-limited fill — fix that first","Any material/dryer/lot change?"]},{"id":"fill_peak","name":"Fill Peak","yourScreen":"1554 kgf/cm2","whatItTells":"The highest injection pressure during fill — what it actually cost to push melt in at your set speed. At fixed speed, this is a live viscosity gauge: material, temperature, and flow-restriction changes all show up here first.","healthy":"Stable, with clear headroom below the pressure limit (yours: 1554 vs a 1680 limit — about 8% headroom, on the tight side).","rising":"Melt getting stiffer or path getting tighter: colder melt, new lot/more regrind, blocked vents or gate, mold cooling colder. If it reaches the limit, velocity control is lost.","falling":"Melt thinner: hotter barrel/shear, wetter material, easier flow. Watch for flash.","checkFirst":["Gap to the pressure limit — keep 10-20%","Correlate with Fill Time: both moving together confirms a real viscosity shift"]},{"id":"all_peak","name":"All Peak","yourScreen":"1559 kgf/cm2","whatItTells":"The highest pressure anywhere in the whole shot — fill or hold. Compare it with Fill Peak: nearly equal (yours: 1559 vs 1554) means the spike lives in fill; much higher than Fill Peak means a pressure spike is happening AT transfer, the classic flash-maker.","healthy":"At or barely above Fill Peak.","rising":"A growing transfer spike: V-P too late, H.V. Limit too aggressive, hold 1st too high for the moment of switchover.","falling":"Transfer getting softer — fine, as long as packing still completes.","checkFirst":["All Peak minus Fill Peak — a big gap points at the transfer moment","Flash starting at the same time? Same root cause"]},{"id":"pack_p","name":"Pack P.","yourScreen":"1292 kgf/cm2","whatItTells":"The pressure actually achieved during pack/hold. Should sit at your hold setpoint — if it can't get there, your parts are not getting the packing the recipe claims.","healthy":"Matches the set hold pressure, steady.","rising":"Only moves if the setpoint or transfer conditions changed.","falling":"Machine failing to reach hold setpoint: H.V. Limit too low to build pressure, cushion collapsing (nothing left to push), or hold time cut before pressure develops.","checkFirst":["Compare against set hold pressure","Check Min Cushion at the same time — no cushion, no pack"]},{"id":"dose_time","name":"Dose Time","yourScreen":"0.67 sec","whatItTells":"How long screw recovery took. A stability gauge for the whole feeding/melting system: material flow, throat, screw and check ring condition, back pressure, RPM.","healthy":"Repeats tightly and finishes comfortably inside cooling time (yours: 0.67 vs 1.2 cooling — fits, thin margin).","rising":"Feeding or melting struggling: bridging at the throat, hopper running out, back pressure up, worn screw slipping, regrind fines.","falling":"Recovering easier: hotter barrel, lower back pressure, freer-flowing material.","checkFirst":["Trend it — a slow climb over hours is a feed-throat or material story","If dose time > cooling time, dosing is now setting your cycle"]},{"id":"cycle_time","name":"Cycle Time","yourScreen":"3.24 sec","whatItTells":"Total shot-to-shot time. Any change means SOMETHING changed — cycle time never drifts on its own; it's the sum of pieces you can check one by one.","healthy":"Flat, boring, identical.","rising":"Find the piece that grew: fill time, dose time, an alarm/retry, mold open-close, ejection, or an operator in semi-auto.","falling":"Someone changed a setting — confirm it was on purpose and documented.","checkFirst":["Compare the sub-times (fill, dose, mold open/close, eject) against a known-good setup sheet","Semi-auto? The human is the variable"]},{"id":"screw_torq","name":"Screw Torque","yourScreen":"0.9 %","whatItTells":"How hard the dose servo is working to turn the screw. A melt-stiffness and mechanical-health gauge for recovery.","healthy":"Low and steady during dosing for the given resin.","rising":"Screw fighting: barrel rear too cold, unmelted or contaminated material, back pressure raised, mechanical drag. Sudden spikes on a cold start = you rotated before soak — stop.","falling":"Easier rotation: hotter rear zones, slippery material, or a worn screw doing less work (with dose time rising alongside).","checkFirst":["Never judge on a cold machine — full heat soak first","Rising torque + rising dose time together = melting-system problem, not coincidence"]},{"id":"peak_clamp","name":"Peak Clamp","yourScreen":"104 TF","whatItTells":"The highest clamp tonnage seen during the shot. Injection pressure tries to blow the mold open; the extra tonnage above your setpoint (yours: 104 vs 100 set) is the cavity pushing back through the steel.","healthy":"Slightly above setpoint, consistent.","rising":"Cavity pressure climbing: hotter pack, later transfer, higher hold — the mold is being worked harder. Big rises risk flash and tool fatigue.","falling":"Less cavity load — or tonnage decaying (see Auto Clamp Force Correction).","checkFirst":["Delta vs setpoint over time — a growing gap tracks a hotter, more aggressive pack","Flash appearing as this climbs confirms it"]},{"id":"clamp_f_hold_end","name":"Clamp F (Hold End)","yourScreen":"101.1 TF","whatItTells":"Clamp force remaining when hold finished. Confirms tonnage held through the whole pressure phase instead of decaying mid-shot.","healthy":"Right at setpoint (yours: 101.1 vs 100 — textbook).","rising":"Thermal growth of mold/toggle adding tonnage — correction system should be trimming this.","falling":"Tonnage bleeding off during the shot: correction fault, mechanical/lubrication issue, mold-height setup. Flash at end-of-pack follows.","checkFirst":["Auto Clamp Force Correction ON and healthy?","Compare morning vs afternoon — drift with temperature points at thermal correction"]},{"id":"clamp_force_actual","name":"Clamp Force (Actual)","yourScreen":"102 TF","whatItTells":"Live measured tonnage while clamped. The truth against which the 100 TF setpoint is judged.","healthy":"Within a ton or two of setpoint all day.","rising":"Thermal expansion of the mold stack — on a toggle machine this silently over-tonnages until corrected.","falling":"Losing squeeze: correction issue, mechanical wear, something changed in mold height. Parting-line flash is the symptom that follows.","checkFirst":["Watch it across warm-up — that's exactly what Auto Clamp Force Correction exists to flatten","CF1-CF4 (per-tie-bar) even? Uneven = parallelism problem"]}],"defects":[{"id":"short_shot","name":"Short Shot","category":"Fill & Pack","description":"Part is incomplete — the melt froze or ran out before the cavity filled. Shows at the far end of flow, thin walls, or behind trapped air.","quickCheck":["Is Min Cushion still there, or did it hit zero?","Is Fill Peak flatlined at the Maximum Filling Pressure limit?","All cavities short, or just some?"],"causes":[{"rank":1,"cause":"Not enough material committed before transfer","fix":"Move V-P transfer later (lower the position number) or increase dose position (shot size)","settings":["vp_transfer_position","dose_position"]},{"rank":2,"cause":"Pressure-limited fill — machine can't hold set speed","fix":"Raise Maximum Filling Pressure to restore headroom (10-20% above Fill Peak)","settings":["fill_pressure_limit","fill_velocity"]},{"rank":3,"cause":"Melt or mold too cold — front freezing off","fix":"Raise barrel temps and/or mold temp; raise fill velocity so the front runs hotter","settings":["barrel_temps","mold_temp","fill_velocity"]},{"rank":4,"cause":"Trapped gas blocking the last-to-fill area","fix":"Clean vents; try lower clamp force; slow the final fill stage so gas can escape","settings":["clamp_force","fill_velocity"]},{"rank":5,"cause":"Check ring leaking — melt slipping backward","fix":"Run Flow-Check / watch cushion repeatability; schedule check-ring service","settings":["flow_check"]},{"rank":6,"cause":"Nozzle or gate partially blocked (cold slug)","fix":"Raise nozzle temp slightly; verify suck back isn't freezing the tip","settings":["nozzle_temp","pull_back_after_dose"]}],"diagnosticSteps":["Confirm cushion exists — zero cushion means shot size / transfer, stop there","Check Fill Peak vs the pressure limit — if clipped, fix the limit before anything else","One cavity short in a multi-cavity tool = tool issue (vent/gate), not process","Only then adjust temperature or speed, one change at a time"]},{"id":"flash","name":"Flash","category":"Fill & Pack","description":"Thin skin of plastic squeezed out at the parting line, vents, or around pins — the mold was forced open or the melt found a gap.","quickCheck":["Did All Peak jump above Fill Peak? (transfer spike)","Is actual clamp force at setpoint?","New flash on an old mold, or old mold just worn?"],"causes":[{"rank":1,"cause":"Transfer too late — cavity overfilled on velocity","fix":"Raise the V-P transfer position (transfer earlier)","settings":["vp_transfer_position"]},{"rank":2,"cause":"Pack too aggressive","fix":"Lower 1st hold pressure, or lower H.V. Limit to soften the transfer spike","settings":["hold_pressure","hold_velocity_limit"]},{"rank":3,"cause":"Clamp tonnage low vs cavity pressure","fix":"Verify actual clamp = setpoint (correction ON); raise clamp force only after that checks out","settings":["clamp_force","auto_clamp_correction"]},{"rank":4,"cause":"Melt too thin (hot)","fix":"Lower barrel temps and/or fill velocity — watch Fill Peak fall as viscosity rises","settings":["barrel_temps","fill_velocity"]},{"rank":5,"cause":"Mold worn or debris on the parting line","fix":"Inspect and clean faces; flash localized in one spot is usually steel, not process"}],"diagnosticSteps":["Where is it? All around = tonnage/overpack; one spot = tool or debris","Check All Peak vs Fill Peak — a spike at transfer is the classic new-flash cause","Confirm tonnage isn't decaying (Clamp F at Hold End)","Then walk hold pressure down in small steps"]},{"id":"burn_marks","name":"Burn Marks (Dieseling)","category":"Fill & Pack","description":"Black or brown scorched spots, usually at end-of-fill or dead corners — trapped air compressed so fast it ignited and charred the melt.","quickCheck":["Always the same location? (trapped-gas signature)","Were vents recently cleaned?","Did clamp force get raised lately?"],"causes":[{"rank":1,"cause":"Vents blocked or crushed shut","fix":"Clean vents; try LOWER clamp force — over-tonnage crushes vents closed","settings":["clamp_force"]},{"rank":2,"cause":"Fill too fast at end of flow — air can't escape","fix":"Lower the last fill-stage velocity, or add a slow final stage","settings":["fill_velocity","fill_stage_select","fill_stage_positions"]},{"rank":3,"cause":"Pressure spike at transfer slamming trapped gas","fix":"Raise V-P position (transfer earlier)","settings":["vp_transfer_position"]},{"rank":4,"cause":"Melt too hot — chars easily","fix":"Lower barrel temps, back pressure, screw RPM","settings":["barrel_temps","back_pressure","screw_rpm"]}],"diagnosticSteps":["Fixed location = venting; clean vents and retest before touching process","Slow only the final 10-15% of fill — don't give up your whole fill speed","If it started after a tonnage increase, that's your answer"]},{"id":"weld_lines","name":"Weld / Knit Lines","category":"Fill & Pack","description":"A visible line (and weak spot) where two flow fronts met — downstream of holes, cores, or multiple gates. Cold fronts don't knit.","quickCheck":["Cosmetic problem, strength problem, or both?","Is there a vent at the meeting point?","Mold temp actually at setpoint on the steel?"],"causes":[{"rank":1,"cause":"Flow fronts too cold when they meet","fix":"Raise fill velocity; raise melt and mold temps — hotter fronts knit stronger and fainter","settings":["fill_velocity","barrel_temps","mold_temp"]},{"rank":2,"cause":"Not packed together after meeting","fix":"Raise hold pressure so the joint gets forged, verify gate seal covers it","settings":["hold_pressure","hold_time"]},{"rank":3,"cause":"Gas trapped exactly at the knit point","fix":"Vent at the weld location; lower clamp if vents are being crushed","settings":["clamp_force"]},{"rank":4,"cause":"Gate location puts the weld in a bad spot","fix":"Tool change — move/resize gate or add flow leader (design fix, log it)"}],"diagnosticSteps":["Raise mold temp first — biggest weld-line lever for cosmetics","Then fill speed, watching for burn at the same spot (venting)","Strength-critical welds may need the tooling fix, not process"]},{"id":"sink_marks","name":"Sink Marks","category":"Surface","description":"Shallow depressions on the surface opposite thick sections, ribs, or bosses — the core stayed molten, kept shrinking, and pulled the skin in.","quickCheck":["Over ribs/bosses? (thickness-driven)","Cushion stable through hold?","Was hold time proven past gate seal?"],"causes":[{"rank":1,"cause":"Not enough pack","fix":"Raise 1st hold pressure in steps; confirm Pack P. actually reaches setpoint","settings":["hold_pressure","hold_velocity_limit"]},{"rank":2,"cause":"Gate not sealed when hold ends — pack leaks back out","fix":"Raise hold time; run a gate-seal (weight) study","settings":["hold_time"]},{"rank":3,"cause":"Cushion collapsing — nothing left to pack with","fix":"Raise dose position to restore cushion; investigate check ring if it wanders","settings":["dose_position","flow_check"]},{"rank":4,"cause":"Melt too hot — more volumetric shrink than pack can replace","fix":"Lower barrel temps modestly","settings":["barrel_temps"]},{"rank":5,"cause":"Mold too hot over the sink area","fix":"Lower mold temp / check the cooling circuit behind that face","settings":["mold_temp"]}],"diagnosticSteps":["Weigh parts while stepping hold time up — weight plateau = gate seal; sinks past that point aren't a time problem","Then step hold pressure up, watching flash and dimensions","Persistent sink over a thick boss with everything maxed = design/thickness, log it"]},{"id":"voids","name":"Voids / Bubbles","category":"Surface","description":"Hollow pockets inside the part (cut one open to confirm). Vacuum voids come from shrinkage in thick sections; gas voids come from air or volatiles carried in the melt.","quickCheck":["Void round and in the thickest section? (vacuum)","Material verified dry?","Bubbles visible in a purge patty?"],"causes":[{"rank":1,"cause":"Vacuum void — thick core shrank unpacked","fix":"Raise hold pressure and hold time; raise mold temp so the skin stays packable longer","settings":["hold_pressure","hold_time","mold_temp"]},{"rank":2,"cause":"Moisture gassing in the melt","fix":"Verify drying (dewpoint, time, temp) before touching the press","settings":[]},{"rank":3,"cause":"Air pulled in by decompression","fix":"Lower after-dose pull back distance","settings":["pull_back_after_dose"]},{"rank":4,"cause":"Air trapped during recovery","fix":"Raise back pressure to squeeze air out of the melt","settings":["back_pressure"]}],"diagnosticSteps":["Cut the part: smooth round void in thick center = vacuum → pack harder; scattered irregular bubbles = gas → dryness/decompression","Purge and look for foam or bubbles in the patty","Fix gas at the source; don't try to pack gas away"]},{"id":"splay","name":"Splay / Silver Streaks","category":"Surface","description":"Silver or off-color streaks fanning across the surface in the flow direction, usually from the gate — gas (steam, air, or degradation volatiles) smeared along the skin.","quickCheck":["Dryer: dewpoint, temp, and actual hours in the hopper?","Melt temp vs datasheet max?","Suck back recently increased?"],"causes":[{"rank":1,"cause":"Moisture in the resin (the big one)","fix":"Fix drying — dewpoint around -40, correct temp, full residence; check for condensation and dryer bypass","settings":[]},{"rank":2,"cause":"Melt overheating / degrading","fix":"Lower barrel temps, screw RPM, and back pressure; check residence time isn't excessive","settings":["barrel_temps","screw_rpm","back_pressure","dose_delay"]},{"rank":3,"cause":"Air sucked into the nozzle by decompression","fix":"Lower after-dose pull back until gate-area splay stops","settings":["pull_back_after_dose"]},{"rank":4,"cause":"Shear splay at the gate","fix":"Lower the first fill-stage velocity through the gate","settings":["fill_velocity","fill_stage_positions"]},{"rank":5,"cause":"Drool / cold material smeared in","fix":"Trim nozzle temp; balance with suck back","settings":["nozzle_temp","pull_back_after_dose"]}],"diagnosticSteps":["Always rule out moisture first — pull a sample and verify drying, don't trust the schedule","Streaks only at the gate = decompression air or gate shear; everywhere = moisture or melt temp","Change one variable, run 10 shots, judge"],"notes":"Hygroscopic resins (PC, PA/nylon, PBT, ABS) will splay from moisture you can't see or feel. PC and nylon also lose strength (hydrolysis) — wet molding hurts more than cosmetics."},{"id":"flow_lines","name":"Flow Lines / Record Grooves","category":"Surface","description":"Ripples, halos, or ring patterns on the surface tracking the flow front — the front moved too slowly or unevenly and each hesitation printed.","quickCheck":["Front too slow (fill time long)?","Mold temp low?","Do rings match a velocity stage change position?"],"causes":[{"rank":1,"cause":"Flow front too cold/slow — printing as it creeps","fix":"Raise fill velocity; raise mold temp","settings":["fill_velocity","mold_temp"]},{"rank":2,"cause":"Melt too cold","fix":"Raise barrel temps","settings":["barrel_temps"]},{"rank":3,"cause":"Visible hesitation at a stage break","fix":"Smooth the profile — move or remove the stage transition","settings":["fill_stage_positions","fill_stage_select"]},{"rank":4,"cause":"Under-packed surface not replicating steel","fix":"Raise hold pressure","settings":["hold_pressure"]}],"diagnosticSteps":["Raise mold temp and fill speed first — the classic pair for this defect","If a ring sits exactly where a velocity change happens, that's your smoking gun","Confirm no burn appears at end-of-fill as you speed up"]},{"id":"gloss_variation","name":"Gloss Variation","category":"Surface","description":"Patchy shiny/dull areas — surface replication of the steel varied, from uneven mold temperature, uneven packing, or flow behavior.","quickCheck":["Dull patch over one cooling circuit?","Same patch every shot? (thermal) ","Texture tool or polished?"],"causes":[{"rank":1,"cause":"Mold surface temperature uneven","fix":"Check every cooling circuit flow; balance halves; pyrometer-map the steel","settings":["mold_temp"]},{"rank":2,"cause":"Packing uneven — dull where pressure is low","fix":"Raise hold pressure / hold time; verify gate seal","settings":["hold_pressure","hold_time"]},{"rank":3,"cause":"Fill speed changes printing gloss bands","fix":"Smooth the velocity profile","settings":["fill_velocity","fill_stage_positions"]},{"rank":4,"cause":"Tool surface condition (polish/texture wear, deposits)","fix":"Clean/inspect the cavity surface — outgassing deposits dull steel over a run"}],"diagnosticSteps":["Map the dull zones against cooling circuits first","Higher mold temp generally = higher, more even gloss","If gloss shifts over a run with no setting change: deposits on the steel"]},{"id":"jetting","name":"Jetting","category":"Gate & Nozzle","description":"A worm-like squiggle on the surface starting at the gate — melt shot across the cavity as a rope instead of flowing as a front, then froze.","quickCheck":["Squiggle starts at the gate?","First-stage speed high through the gate?","Cold slug well present/working?"],"causes":[{"rank":1,"cause":"Melt jets through the gate too fast","fix":"Lower the 1st fill-stage velocity until flow lays down, then speed up after the gate","settings":["fill_velocity","fill_stage_positions","fill_stage_select"]},{"rank":2,"cause":"Cold slug fired into the cavity","fix":"Raise nozzle temp slightly; check suck back isn't freezing the tip; verify cold-slug well","settings":["nozzle_temp","pull_back_after_dose"]},{"rank":3,"cause":"Melt too cold and stiff — ropes instead of fans","fix":"Raise barrel temps","settings":["barrel_temps"]},{"rank":4,"cause":"Gate geometry aims flow into open space","fix":"Tooling: impinge flow against a wall/pin, or enlarge gate (log it)"}],"diagnosticSteps":["Slow ONLY the gate stage — add a stage break just past the gate and restore speed after","If a cold blemish rides the jet, chase nozzle temp / cold slug","Still jetting slow and hot = gate design"]},{"id":"gate_blush","name":"Gate Blush","category":"Gate & Nozzle","description":"A hazy, dull, or discolored halo right at the gate — high shear tearing the surface as melt rams through the smallest opening in the system.","quickCheck":["First-stage velocity?","Gate size/condition?","Melt temp low (stiff melt shears worse)?"],"causes":[{"rank":1,"cause":"Too much shear through the gate","fix":"Lower 1st-stage fill velocity through the gate","settings":["fill_velocity","fill_stage_positions"]},{"rank":2,"cause":"Melt too cold at the gate","fix":"Raise barrel/nozzle temps a step","settings":["barrel_temps","nozzle_temp"]},{"rank":3,"cause":"Pack slamming the gate area","fix":"Soften transfer (H.V. Limit) or taper hold with a lower 2nd stage","settings":["hold_velocity_limit","hold_pressure"]},{"rank":4,"cause":"Gate too small or sharp-edged","fix":"Tooling: open/radius the gate (log it)"}],"diagnosticSteps":["Slow the gate stage first — blush responds fast if shear is the cause","Then a modest melt-temp bump","No response = gate steel"]},{"id":"stringing","name":"Stringing","category":"Gate & Nozzle","description":"Fine threads of plastic trailing from the nozzle or gates when the mold opens — melt at the tip stayed fluid and pulled into strings.","quickCheck":["Nozzle temp vs front zone?","Suck back amount?","Hot runner tips or cold sprue?"],"causes":[{"rank":1,"cause":"Not enough decompression","fix":"Raise after-do
