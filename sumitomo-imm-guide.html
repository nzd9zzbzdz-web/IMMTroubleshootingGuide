se pull back in 0.5 mm steps until strings stop","settings":["pull_back_after_dose"]},{"rank":2,"cause":"Nozzle/tip too hot","fix":"Lower nozzle temp in small steps","settings":["nozzle_temp"]},{"rank":3,"cause":"Residual melt pressure at mold open","fix":"Enable/raise Ret Vel after hold, or add a small dose delay","settings":["hold_return_velocity","dose_delay"]},{"rank":4,"cause":"Wrong nozzle tip style for the material","fix":"Hardware: consider a shut-off or reverse-taper tip for stubborn resins (log it)"}],"diagnosticSteps":["Suck back up in small steps — stop at the first clean shot (too much causes splay)","Then nozzle temp down a notch at a time","Nylon is the classic stringer — expect to balance both"]},{"id":"drooling","name":"Drooling","category":"Gate & Nozzle","description":"Melt oozing from the nozzle between shots — puddles on the sprue bushing, cold slugs next shot, and blemishes at the gate.","quickCheck":["Fill Start Position drifting? (pressure pushing screw)","Nozzle temp?","Moisture? Wet resin gasses and drools"],"causes":[{"rank":1,"cause":"Melt pressure left in front of the screw","fix":"Raise after-dose pull back; consider Ret Vel","settings":["pull_back_after_dose","hold_return_velocity"]},{"rank":2,"cause":"Nozzle too hot","fix":"Lower nozzle temp","settings":["nozzle_temp"]},{"rank":3,"cause":"Moisture gassing pushes melt out","fix":"Verify drying","settings":[]},{"rank":4,"cause":"Long open time lets the tip drain","fix":"Reduce interval/handling time, or add dose delay so melt is prepared later","settings":["interval_time","dose_delay"]}],"diagnosticSteps":["Watch the tip for one full cycle — when does it drip?","Check Fill Start Position shot-to-shot; drift = pressure escaping out the nozzle","Balance suck back vs nozzle temp; recheck for splay after changes"]},{"id":"warpage","name":"Warpage","category":"Dimensional & Warp","description":"Part twists, bows, or cups after ejection — one region shrank more than another. Differential shrinkage is always the mechanism; the cause is what made it differential.","quickCheck":["Core vs cavity water temps equal?","Warp direction consistent shot to shot?","Glass-filled material? (fiber orientation)"],"causes":[{"rank":1,"cause":"Uneven mold cooling — one face hotter","fix":"Balance/verify every circuit (flow, not just temp); equalize halves","settings":["mold_temp"]},{"rank":2,"cause":"Ejected too hot — part finishes shrinking unrestrained","fix":"Raise cooling time; consider a cooling fixture","settings":["cool_time"]},{"rank":3,"cause":"Overpack near the gate vs starved far end","fix":"Lower 1st hold, use a tapered 2nd stage; verify even fill","settings":["hold_pressure","hold_time"]},{"rank":4,"cause":"Fiber orientation (glass-filled)","fix":"Change fill speed to alter orientation; often a gate-location problem (log it)","settings":["fill_velocity"]},{"rank":5,"cause":"High molded-in stress from cold mold/melt","fix":"Raise mold temp so the part relaxes in the tool","settings":["mold_temp","barrel_temps"]}],"diagnosticSteps":["Thermal-map both halves — a 10 degree imbalance is enough to warp","Add cooling time as a test: warp improves = ejection temp; doesn't = packing/orientation","Adjust pack profile last; measure after 24h (parts keep moving)"]},{"id":"dimensional_drift","name":"Dimensional Drift / Inconsistency","category":"Dimensional & Warp","description":"Dimensions wander shot-to-shot or across a run with nothing 'changed' — the process is leaking consistency somewhere. Part weight is your best tracer.","quickCheck":["Is Min Cushion repeating tightly?","Part weight trend over 30 shots?","Anything thermal still soaking (machine, mold, dryer)?"],"causes":[{"rank":1,"cause":"Cushion wandering — check ring leaking","fix":"Run Flow-Check; verify dose repeatability; service the ring","settings":["flow_check"]},{"rank":2,"cause":"Gate seal marginal — some shots seal, some don't","fix":"Raise hold time past the weight plateau with margin","settings":["hold_time"]},{"rank":3,"cause":"Pressure-limited fill on some shots","fix":"Restore headroom above Fill Peak","settings":["fill_pressure_limit"]},{"rank":4,"cause":"Tonnage drifting with temperature","fix":"Confirm Auto Clamp Force Correction ON and tracking","settings":["auto_clamp_correction"]},{"rank":5,"cause":"Melt inconsistency — feed, drying, regrind ratio","fix":"Stabilize back pressure/RPM; check throat temp; audit material handling","settings":["back_pressure","screw_rpm","feed_throat_temp"]}],"diagnosticSteps":["Weigh 30 consecutive parts — weight scatter maps the problem: with cushion scatter = check ring; with fill-time scatter = fill control","Fix consistency before chasing the nominal dimension","Only then move the mean with hold pressure (bigger) or less pack (smaller)"]},{"id":"black_specks","name":"Black Specks / Contamination","category":"Material & Strength","description":"Dark flecks scattered in the part — charred resin flaking off from dead spots, degraded material, or dirty regrind riding through.","quickCheck":["Specks in the virgin material itself?","How long since a proper purge/screw pull?","Residence time long (small shot, big barrel)?"],"causes":[{"rank":1,"cause":"Degraded resin coating the screw/barrel breaking loose","fix":"Aggressive purge (commercial purge compound); if it returns fast, schedule a screw pull","settings":[]},{"rank":2,"cause":"Running too hot for too long","fix":"Lower barrel temps, back pressure, RPM; reduce residence (dose delay, cycle discipline)","settings":["barrel_temps","back_pressure","screw_rpm","dose_delay"]},{"rank":3,"cause":"Contaminated material path","fix":"Inspect hopper, loader, grinder, and regrind for foreign material and cross-contamination","settings":[]},{"rank":4,"cause":"Barrel/screw wear — plating or steel flakes","fix":"Maintenance inspection if specks are metallic or persistent after purging","settings":[]}],"diagnosticSteps":["Purge to clean, then time how long until specks return — minutes = active degradation; days = deposits","Check specks with a magnifier: charred plastic vs metal vs foreign","Audit residence: shot size well under 20% of barrel capacity means material is cooking in there"]},{"id":"brittleness","name":"Brittleness","category":"Material & Strength","description":"Parts crack or snap under loads they should survive — the polymer chains got shortened (degraded) or the part is full of stress or bad welds.","quickCheck":["Was the resin dry AT molding (PC/PA hydrolyze wet)?","Regrind percentage?","Break always at a weld line?"],"causes":[{"rank":1,"cause":"Hydrolysis — molded wet (PC, nylon, PBT)","fix":"Fix drying; wet molding permanently destroys strength even when parts look fine","settings":[]},{"rank":2,"cause":"Thermal degradation","fix":"Lower barrel temps, RPM, back pressure; cut residence time","settings":["barrel_temps","screw_rpm","back_pressure"]},{"rank":3,"cause":"Too much / too many-pass regrind","fix":"Cap regrind ratio; audit what's actually going in the blender","settings":[]},{"rank":4,"cause":"Weak weld lines","fix":"See Weld Lines — hotter fronts, more pack","settings":["fill_velocity","mold_temp","hold_pressure"]},{"rank":5,"cause":"Molded-in stress","fix":"Raise mold temp; lower hold; avoid cold-fast-stressed processing","settings":["mold_temp","hold_pressure"]}],"diagnosticSteps":["Where does it break? Weld line = knit problem; random = material degradation","Verify drying records and melt temp vs datasheet","Mold a batch at datasheet-nominal everything with verified-dry virgin resin — if strength returns, work back to find the abuse"]},{"id":"delamination","name":"Delamination","category":"Material & Strength","description":"Surface peels in flaky layers like an onion — layers of the part never bonded, usually from contamination or a cold, over-sheared skin.","quickCheck":["Material contamination possible (wrong regrind, unpurged resin)?","Excess mold release spray?","Melt temp low?"],"causes":[{"rank":1,"cause":"Incompatible resin mixed in","fix":"Full purge; audit material handling and grinder for cross-contamination","settings":[]},{"rank":2,"cause":"Cold melt sheared into layers","fix":"Raise barrel temps; lower gate-stage velocity","settings":["barrel_temps","fill_velocity"]},{"rank":3,"cause":"Too much mold release / surface contamination","fix":"Stop the spray; clean the tool — release agent is a bond-breaker between layers","settings":[]},{"rank":4,"cause":"Moisture films between layers","fix":"Verify drying","settings":[]}],"diagnosticSteps":["Peel a flake and burn-test/compare it — contamination is the most common answer","Eliminate mold release entirely as a test","Then melt temp up, gate shear down"]},{"id":"color_streaks","name":"Color Streaks / Poor Mixing","category":"Material & Strength","description":"Swirls or streaks of uneven color — colorant never got homogenized into the melt, or a second material is riding along.","quickCheck":["Masterbatch ratio and mixer working?","Back pressure low?","Streaks appear after a color change? (old color purging out)"],"causes":[{"rank":1,"cause":"Not enough mixing work in recovery","fix":"Raise back pressure; a modest RPM increase adds mixing too","settings":["back_pressure","screw_rpm"]},{"rank":2,"cause":"Masterbatch dosing/carrier problem","fix":"Verify let-down ratio and that the carrier resin matches the base","settings":[]},{"rank":3,"cause":"Rear barrel too cold — pigment not dispersing","fix":"Raise rear zone temps a step","settings":["barrel_temps"]},{"rank":4,"cause":"Incomplete color change purge","fix":"Purge properly (patties until clean); check dead spots in nozzle/tip","settings":[]}],"diagnosticSteps":["Back pressure up first — the #1 mixing knob","Verify the blender/doser actually feeding at ratio","Persistent streaks with everything right = consider a mixing nozzle/screw (hardware)"]},{"id":"unmelts","name":"Unmelts","category":"Material & Strength","description":"Visible solid granules or gels in the part — pellets got to the front of the screw without fully melting.","quickCheck":["Rear zone temps at setpoint?","Dose time very short (screw racing)?","Shot size huge for the barrel?"],"causes":[{"rank":1,"cause":"Not enough melting energy in recovery","fix":"Raise back pressure; lower screw RPM (slower transport = more melting time per flight)","settings":["back_pressure","screw_rpm"]},{"rank":2,"cause":"Rear/mid zones too cold","fix":"Raise rear and middle barrel temps","settings":["barrel_temps"]},{"rank":3,"cause":"Shot too big for the barrel — residence too short","fix":"If shot uses most of the stroke, the machine is undersized for the job (flag it)","settings":["dose_position"]},{"rank":4,"cause":"High-melt-point contaminant in the blend","fix":"Audit material/regrind for a different polymer","settings":[]}],"diagnosticSteps":["Purge patty check — unmelts visible in the purge confirms it's upstream of the mold","Slow RPM + raise BP together, retest","Then rear zones up in 5-10 degree steps"]},{"id":"cracking","name":"Cracking / Stress Whitening","category":"Material & Strength","description":"Cracks or white stress marks, at ejection or days later — molded-in or mechanically applied stress exceeded what the material could carry.","quickCheck":["Cracks at ejector pins / around cores? (mechanical)","Near the gate? (overpack)","Delayed cracking in the field? (residual stress + chemicals)"],"causes":[{"rank":1,"cause":"Overpacking — residual stress especially near the gate","fix":"Lower 1st hold pressure; taper with 2nd stage","settings":["hold_pressure"]},{"rank":2,"cause":"Ejection stress — part too hot or gripped too hard","fix":"Raise cooling time; slow/soften ejector; slow mold-open breakaway","settings":["cool_time","ejector_speed_pressure","mold_open_profile"]},{"rank":3,"cause":"Cold mold = high molded-in stress","fix":"Raise mold temp","settings":["mold_temp"]},{"rank":4,"cause":"Degraded/brittle material","fix":"See Brittleness — drying, temps, regrind","settings":["barrel_temps"]},{"rank":5,"cause":"Sharp corners / thin bosses concentrating stress","fix":"Design: add radii (log for tooling)"}],"diagnosticSteps":["Location tells the story: pin circles = ejection; gate area = pack; random+delayed = stress+environment","Cooling time up as a quick test for ejection-driven cracks","Then walk hold pressure down watching sinks on the other side"]},{"id":"sticking","name":"Part / Sprue Sticking","category":"Ejection & Release","description":"Part hangs in the cavity or on the core, or the sprue stays in the bushing — release forces beat the ejection system.","quickCheck":["Sticks to which half?","Sprue or part?","Did hold pressure change recently?"],"causes":[{"rank":1,"cause":"Overpacked — part gripping the steel","fix":"Lower hold pressure/time; transfer a touch earlier","settings":["hold_pressure","hold_time","vp_transfer_position"]},{"rank":2,"cause":"Too hot at ejection — soft part grabbing","fix":"Raise cooling time; check mold temp","settings":["cool_time","mold_temp"]},{"rank":3,"cause":"Sprue sticking: nozzle/bushing mismatch","fix":"Check nozzle radius and orifice (nozzle hole must be SMALLER than bushing hole); verify sprue puller; cool the sprue more","settings":["cool_time","nozzle_temp"]},{"rank":4,"cause":"Ejection can't overcome release force","fix":"More stroke/pressure or a second count — but treat as a band-aid","settings":["ejector_stroke","ejector_speed_pressure","ejector_count_delay"]},{"rank":5,"cause":"Tool condition — polish, draft, undercuts, damage","fix":"Inspect for drag marks and burrs; polish in draft direction (tool room)"}],"diagnosticSteps":["Which half it sticks to points at that half's release problem","Lower pack first — overpack is the most common process cause","Only reach for stronger ejection after pack and cooling are ruled out"]},{"id":"ejector_marks","name":"Ejector Pin Marks","category":"Ejection & Release","description":"Visible circles, gloss spots, sink-like depressions, or stress rings where the pins push — the part was too soft or the push too hard for the material to take.","quickCheck":["Part temperature at ejection (too soft)?","Ejector speed/pressure high?","Marks raised, sunken, or stress-white?"],"causes":[{"rank":1,"cause":"Part too hot when pushed","fix":"Raise cooling time","settings":["cool_time"]},{"rank":2,"cause":"Ejection too fast/hard","fix":"Lower ejector velocity and pressure","settings":["ejector_speed_pressure"]},{"rank":3,"cause":"High release force making pins work too hard","fix":"Lower hold (overpack); see Sticking","settings":["hold_pressure"]},{"rank":4,"cause":"Pins mis-set or too small for the push (tool)","fix":"Tool room: pin flush/protrusion check; larger or more pins if chronic"}],"diagnosticSteps":["Cooling time up 20% as a test — marks fade = temperature","Then soften ejection","Marks on a cold, gently-ejected part = pin fit/tool issue"]}],"alarms":[{"id":"mold_protect_trip","name":"Mold Protect Trip","whatTriggers":"The mold hit resistance inside the low-pressure protect window and couldn't reach clamp-up within the allowed force/time. The machine stopped instead of crushing whatever is in there.","safeFirstResponse":"STOP. Do not raise protect pressure to push through. Open the mold and physically inspect BOTH faces — look for a hung part, runner, cold slug, or a lifted insert/pin.","rootCauses":["Part or runner left hanging after ejection (the #1 cause) — watch a full ejection with your own eyes; see Sticking","Cold slug or flash debris on a mold face","Protect window mis-set after a mold change — start position below the tallest possible hang-up, or pressure set too low for this tool's normal drag","Sprue picker / robot missed its grab","Mechanical: tight leader pins, low lube, platen parallelism"],"prevention":"After every mold change, re-verify: protect start just above the tallest possible obstruction, lowest pressure that closes an empty mold reliably. Fix ejection reliability instead of numbing the protection.","relatedSettings":["mold_protect","ejector_stroke","ejector_count_delay","mold_close_profile"],"relatedDefects":["sticking"]},{"id":"dose_not_complete","name":"Dose Not Complete","whatTriggers":"The screw failed to reach the dose position within the allowed time — the next shot never got fully prepared.","safeFirstResponse":"Check material supply first: hopper level, loader running, slide gate open. It's embarrassing how often this alarm means 'empty hopper.'","rootCauses":["No/low material: hopper empty, loader fault, slide gate closed","Bridging in the feed throat — throat running warm; pellets sticking together above the screw","Back pressure too high or RPM too low for the required recovery","Worn screw/barrel or leaking check ring — screw spins but doesn't convey","Material issue: high regrind fines, oversize regrind, blended contaminant"],"prevention":"Trend Dose Time — it stretches for hours before this alarm fires. Keep throat cooling verified on the startup checklist.","relatedSettings":["feed_throat_temp","back_pressure","screw_rpm","dose_position"],"relatedDefects":["short_shot","unmelts"]},{"id":"cushion_alarm","name":"Minimum Cushion Alarm","whatTriggers":"Min Cushion fell below its monitored limit — the screw is running out of melt before packing finished.","safeFirstResponse":"Check the last parts for shorts/sinks, then look at the cushion trend: sudden drop or slow bleed?","rootCauses":["Check ring leaking — the classic; cushion wanders then collapses (run Flow-Check / static leak test)","Shot size too small for the part + cushion (raise Dose Position)","V-P transfer moved later, eating the reserve","Melt got thinner (hotter/wetter) so more material packs in before the screw bottoms","New mold/cavity condition taking more material (e.g., vent/flash path opened)"],"prevention":"Give yourself a real cushion (not fractions of a mm) and monitor it — cushion is the canary for check-ring health.","relatedSettings":["dose_position","vp_transfer_position","flow_check"],"relatedDefects":["short_shot","sink_marks","dimensional_drift"]},{"id":"fill_watchdog_alarm","name":"Fill Time / Pressure Limit Alarm","whatTriggers":"Fill exceeded the Fill Time Limit, or injection pressure hit the Maximum Filling Pressure hard enough to stall progress — the shot couldn't get in.","safeFirstResponse":"Don't just widen the limit. Check the obvious blockers: material in the barrel? Nozzle frozen? Gate blocked by a cold slug?","rootCauses":["Nozzle freeze-off or cold slug blocking the tip (nozzle temp / suck back balance)","Empty barrel — see Dose Not Complete upstream","Genuine viscosity jump: cold melt, wrong material loaded, dryer down","Pressure limit set with no headroom — normal variation now clips it","Check ring failed — screw moves but melt goes backward"],"prevention":"Keep 10-20% headroom between Fill Peak and the pressure limit; trend Fill Time so drift is caught before the alarm.","relatedSettings":["fill_pressure_limit","fill_time_limit","nozzle_temp","pull_back_after_dose"],"relatedDefects":["short_shot"]},{"id":"heater_deviation","name":"Heater Deviation / Thermocouple Fault","whatTriggers":"A temperature zone drifted outside its allowed band, or its sensor reads open/erratic.","safeFirstResponse":"Identify WHICH zone and WHICH direction. A zone stuck HIGH (possible stuck-on relay) is a runaway risk — get maintenance/supervision involved; don't just acknowledge and keep molding.","rootCauses":["Thermocouple loose, damaged, or unplugged (reads low or erratic → zone overheats trying to chase it)","Heater band burned out or connector failed (zone can't reach setpoint)","Solid-state relay stuck ON (zone climbs past setpoint — the dangerous one) or stuck OFF","Band loose on the barrel — poor contact, slow lying readings"],"prevention":"Degraded material and splay often show up before the alarm — a zone that 'takes forever to heat' is a heater on its way out.","relatedSettings":["barrel_temps","nozzle_temp"],"relatedDefects":["splay","black_specks","unmelts","short_shot"]},{"id":"torque_overload","name":"Servo Torque Overload (Dose / Injection Axis)","whatTriggers":"A servo axis (usually screw rotation) exceeded its torque limit — the all-electric equivalent of a hydraulic relief blowing.","safeFirstResponse":"Do NOT keep retrying rotation. Verify every barrel zone is AT setpoint and has soaked 10-15+ minutes. Rotating a screw in half-melted plastic is how screws snap.","rootCauses":["Cold start / insufficient heat soak (the classic — and the expensive one)","Foreign object in the feed (metal, oversize regrind) jamming the flights","Back pressure set excessively high for the material","Very stiff/filled resin with rear zones too cold","Mechanical: drive/bearing problem (persistent overloads at temp)"],"prevention":"Enforce a soak timer after heats reach setpoint. Magnet in the feed path if regrind is in play.","relatedSettings":["barrel_temps","back_pressure","screw_rpm"],"relatedDefects":["unmelts","black_specks"]},{"id":"clamp_correction_fault","name":"Clamp Force Correction Fault","whatTriggers":"The auto tonnage correction system can't reach or hold the set clamp force within its adjustment range.","safeFirstResponse":"Check for anything physically between the platens and confirm the mold is seated/bolted correctly before re-homing anything.","rootCauses":["Mold-height setup off after a mold change (correction runs out of travel)","Large thermal swing pushed the toggle outside the correction window","Tie-bar strain unbalanced — parallelism, uneven mold, or a bent issue (check CF1-CF4 spread)","Lubrication / mechanical drag in the toggle","Load-cell or sensor fault"],"prevention":"Re-run mold height setup on every change; watch the CF1-CF4 per-tie-bar values for balance — big spread is a mechanical warning.","relatedSettings":["auto_clamp_correction","clamp_force"],"relatedDefects":["flash","dimensional_drift"]},{"id":"safety_interlock","name":"Safety Door / Purge Guard Interlock","whatTriggers":"A guarded door or purge shield is open or its switch isn't satisfied — motion is locked out.","safeFirstResponse":"It's doing its job. Close/verify the guard. NEVER bypass, jumper, or tape a safety switch — molten plastic and clamp motion are the two things on this machine that maim.","rootCauses":["Door not fully closed / slammed out of alignment","Switch or actuator misaligned, worn, or damaged","Purge guard open from the last purge","Wiring/connector fault on the interlock circuit (maintenance)"],"prevention":"Report sticky or misaligned guards immediately — a guard people fight with is a guard someone will eventually defeat.","relatedSettings":[],"relatedDefects":[]},{"id":"ejector_fault","name":"Ejector Fault (Position / Return)","whatTriggers":"The ejector plate didn't reach its commanded position or didn't confirm return before the mold was allowed to close.","safeFirstResponse":"Inspect the mold: a jammed part or broken pin can be holding the plate. Confirm the plate is fully back before any close attempt.","rootCauses":["Part jammed in the ejection path","Return confirmation (limit/proximity) switch misadjusted or failed","Ejector settings asking for travel the mold doesn't have (stroke past mechanical stop)","Broken/bent pin or return spring binding the plate","Speed/pressure too low to overcome release force (see Sticking)"],"prevention":"After mold changes, verify ejector stroke against the tool's actual travel before running auto.","relatedSettings":["ejector_stroke","ejector_speed_pressure","ejector_count_delay"],"relatedDefects":["sticking","ejector_marks"]},{"id":"nozzle_clog","name":"Nozzle Freeze-Off / Clog","whatTriggers":"Melt can't get through the nozzle — fill stalls immediately, pressure spikes at zero progress, or purging produces nothing.","safeFirstResponse":"Treat a blocked, heated nozzle as pressurized. Follow safe purge procedure — shields down, nobody in line with the nozzle, never look into or probe a hot nozzle from the front.","rootCauses":["Nozzle temp too low or its heater failed — tip frozen against the cold sprue bushing","Excessive suck back pulled cold material into the tip which then froze","Foreign object or char lodged in the tip orifice","Long idle at temperature let the tip drain/set up","Wrong tip orifice vs sprue bushing (chronic version)"],"prevention":"Balance nozzle temp with suck back rather than maxing either; on shutdowns, purge and back the carriage off the bushing.","relatedSettings":["nozzle_temp","pull_back_after_dose"],"relatedDefects":["short_shot","jetting","drooling"]}],"guides":[{"id":"decoupled_molding","name":"Decoupled Molding in Plain Language","minutes":3,"body":"The whole modern method fits in one sentence: fill fast under velocity control, switch to pressure control when the part is nearly full, and let hold pressure finish and pack it.\n\nWhy split it? Because fill and pack want opposite things. Fill wants speed — a fast flow front stays hot, shear-thins the melt, and reaches the end before freezing. Pack wants controlled force — gently finishing the last few percent and squeezing in extra material as the part shrinks.\n\nThe machine does this with two control modes. During FILL, it holds your set velocity and uses whatever pressure that takes (up to the limit) — pressure is the output, speed is the input. At the V-P transfer position it flips: now PRESSURE is the input, and the screw moves however it must to hold it.\n\nEverything on the Plast screen belongs to one side of that line. Velocities, stage positions, pressure limit, fill time: the fill side. Hold pressure, hold time, H.V. limit: the pack side. V-P transfer is the border between them, and cushion is proof the pack side still had material to work with.\n\nWhen troubleshooting, first ask: is this a FILL problem (short, burn, jetting, weld) or a PACK problem (sink, void, flash at transfer, dimensions)? Half the battle is knowing which side of the transfer you're on."},{"id":"fill_only_study","name":"The Fill-Only Study (Setting V-P Transfer)","minutes":4,"body":"Goal: prove the cavity is about 95-98% full at transfer, filled by velocity — not by luck.\n\nHow: 1) Safety and scrap awareness first — you will make intentional shorts. 2) Set hold pressure to (near) zero and hold time minimal, so the part shows ONLY what fill delivered. 3) Mold a shot. The part should come out short. 4) Adjust the V-P transfer position until the fill-only part is just barely short — around 95-98% full by eye/weight. Lower the position number to fill more, raise it to fill less. 5) Restore hold pressure and time. Hold now finishes the last few percent and packs.\n\nWhy it matters: if velocity fills 100%+ of the part, every viscosity wiggle becomes flash and pressure spikes. If velocity fills 85%, hold pressure is doing fill's job slowly and inconsistently — sinks and dimensional scatter follow.\n\nWhile you're there, run the viscosity curve: fill-only shots across a range of speeds, note Fill Peak and Fill Time at each. Plot effective viscosity (pressure x time, roughly) versus speed. Pick a speed on the flat part of the curve — there, normal variation barely changes how the material flows, and your process is robust by design."},{"id":"gate_seal_study","name":"The Gate Seal Study (Setting Hold Time)","minutes":3,"body":"Hold pressure only works while the gate is open. The gate-seal study finds the moment it freezes shut — after that, hold time is pure wasted cycle.\n\nHow: 1) Set hold time clearly short (say 1 second). 2) Mold 3-5 shots, weigh the parts, average. 3) Add 0.5s and repeat. 4) Keep stepping. Part weight climbs while the gate is open, then flattens — that plateau is gate seal. 5) Set production hold time just past the plateau (a small margin).\n\nReading it: weight still climbing at your current hold time means you've been discharging pack back out through an open gate — that's sink marks, voids, and weight scatter you were paying for. Weight flat well before your hold time means free cycle time to claim.\n\nRemember: gate seal moves when melt temp, mold temp, or the gate itself changes. Re-verify after those, not just at setup."},{"id":"cushion_explained","name":"Cushion: The Most Important Small Number","minutes":3,"body":"Cushion is the melt left in front of the screw when hold finishes — the screw did NOT bottom out. On your screen it's Min Cushion (4.81 mm in your photo).\n\nWhy it matters: hold pressure reaches the part THROUGH that melt. Screw bottomed = pressure pushes on steel, part gets nothing, and the last part of pack silently never happened. No cushion, no control.\n\nWhat its behavior tells you: A steady cushion is a healthy process. A wandering cushion is the classic worn check ring — melt slips backward past the ring differently every shot. A shrinking cushion means the shot is too small, transfer moved, or the melt thinned. Growing means viscosity rose or shot size crept.\n\nRules of thumb: keep a real cushion (a few mm, not fractions), never chase defects by letting it approach zero, and treat cushion repeatability as your #1 daily consistency check. When dimensions or weights scatter and nothing was 'changed,' look here first."},{"id":"clamp_tonnage","name":"Clamp Tonnage: Enough, Not Extra","minutes":3,"body":"Clamp force must beat the force trying to blow the mold open: cavity pressure x projected part area. Old rule of thumb: 2-5 tons per square inch of projected area (part + runners as seen from the clamp direction), material and pack-aggression dependent.\n\nBut more is not safer. Excess tonnage crushes vent depth — and crushed vents cause burns and end-of-fill shorts, plus platen wear and wasted energy. The modern method: find the LOWEST tonnage that doesn't flash, add a small safety margin, run there.\n\nYour machine helps: it computes a minimum clamp value (your screen showed 14-15 TF against a 100 TF setpoint — a huge gap worth a trial), and Full Auto Clamp Force Correction holds the tonnage steady as the mold and toggle grow with heat, so morning and afternoon behave the same.\n\nWatch Peak Clamp on the Actual display: the amount it rises above setpoint during injection is the cavity pushing back. If that delta grows over time, your pack is getting hotter — address that before it becomes flash."},{"id":"drying_moisture","name":"Drying & Moisture: The Silent Part-Killer","minutes":4,"body":"Hygroscopic resins (PC, nylon/PA, PBT, PET, ABS to a degree) pull moisture INTO the pellet from the air. You cannot see it, feel it, or shake it off — only proper drying removes it.\n\nAt melt temperature, that water does two things. Cosmetically: it flashes to steam and drags silver streaks (splay) across the surface. Structurally — and this is the one people miss — in PC, PA, and PBT it chemically cuts the polymer chains (hydrolysis). Those parts are permanently brittle even when they LOOK perfect. You cannot re-mold your way out; the damage happened in the barrel.\n\nDrying has three legs, and all three must be true: temperature (per datasheet), TIME at temperature (residence in the dryer, typically 2-6 hours — a hopper topped up an hour ago is not dry), and dewpoint (a desiccant dryer around -40; a hot-air hair-dryer setup does not dry hygroscopic resin).\n\nWhen splay or brittleness appears, verify drying with your own eyes before touching one machine setting: dewpoint reading, hopper level history, dryer temp at the hopper (not just the display), and no open bags feeding the loader."},{"id":"residence_time","name":"Residence Time: How Long Melt Sits in the Barrel","minutes":3,"body":"Residence time is how long a pellet spends between entering the feed throat and leaving the nozzle. Too long at melt temperature and even tough resins degrade: splay, black specks, brittleness, yellowing.\n\nQuick estimate: barrel capacity divided by shot size, times cycle time. Example: a shot that's 10% of barrel capacity on a 30-second cycle means material sits roughly 10 cycles = about 5 minutes in the heat. Fine for PP; risky for POM or a flame-retardant grade.\n\nRules of thumb: shots below ~20% of barrel capacity deserve attention (small part on a big machine = long, hot residence — consider lower barrel temps, especially rear zones); shots above ~65-70% risk unmelts (not enough time to fully melt). Heat-sensitive materials want the middle of that window and modest temperatures.\n\nLevers on this machine: barrel temps (down for long residence), dose delay (prepares melt later so it sits less after dosing), interval discipline (semi-auto pauses cook the barrel contents), and honest cycle time. And when a machine sits idle hot: purge before restarting production — the first shots are the oldest, most abused material in the building."}],"wizard":{"start":"root","nodes":{"root":{"q":"What's wrong with the part?","options":[{"a":"It isn't fully formed, or the shape is wrong","next":"shape"},{"a":"The surface looks wrong (streaks, marks, dull, patterns)","next":"surface"},{"a":"It's weak, cracks, or breaks","next":"strength"},{"a":"Marks, threads, or ooze near the gate or nozzle","next":"gate"},{"a":"Trouble getting the part out of the mold","next":"ejection"},{"a":"Dimensions are off or drift shot-to-shot","next":"dims"},{"a":"Specks or color problems in the plastic","next":"material"}]},"shape":{"q":"How is the shape wrong?","options":[{"a":"It didn't fill out — part is incomplete","next":"r_short_shot"},{"a":"Thin flakes of plastic at the edges or parting line","next":"r_flash"},{"a":"Dimples or depressions over thick areas, ribs, or bosses","next":"r_sink"},{"a":"Hollow pockets inside (found when you cut it open)","next":"r_voids"},{"a":"It twists, bows, or cups after ejection","next":"r_warpage"}]},"surface":{"q":"What does the surface look like?","options":[{"a":"Silver or off-color streaks fanning from the gate","next":"r_splay"},{"a":"Brown or black scorched spots","next":"r_burn"},{"a":"A worm-like squiggle starting at the gate","next":"r_jetting"},{"a":"A hazy, dull halo right around the gate","next":"r_gate_blush"},{"a":"Ripples, rings, or halos tracking the flow","next":"r_flow_lines"},{"a":"A visible line where two flow fronts met","next":"r_weld"},{"a":"Patchy shiny and dull areas","next":"r_gloss"},{"a":"The surface peels off in flaky layers","next":"r_delam"},{"a":"Swirls or streaks of uneven color","next":"r_color"}]},"strength":{"q":"How does it fail?","options":[{"a":"Snaps or cracks under loads it should handle (brittle)","next":"r_brittle"},{"a":"Cracks or white stress marks at ejection or later","next":"r_cracking"},{"a":"It always breaks along a visible line","next":"r_weld"},{"a":"The surface peels apart in layers","next":"r_delam"}]},"gate":{"q":"What's happening at the gate or nozzle?","options":[{"a":"Fine threads or strings trail when the mold opens","next":"r_stringing"},{"a":"Melt oozes or drools from the nozzle between shots","next":"r_drooling"},{"a":"A worm-like squiggle mark at the gate","next":"r_jetting"},{"a":"A hazy, dull halo at the gate","next":"r_gate_blush"}]},"ejection":{"q":"What's the ejection problem?","options":[{"a":"Part hangs in the cavity or on the core; sprue stuck","next":"r_sticking"},{"a":"Circles, gloss, or sink marks where the pins push","next":"r_ejector"},{"a":"Cracks or stress-whitening at the pins on ejection","next":"r_cracking"}]},"dims":{"q":"What's off dimensionally?","options":[{"a":"Sizes wander shot-to-shot with nothing changed","next":"r_dim_drift"},{"a":"Consistent, but the wrong size","next":"r_dim_drift"},{"a":"It twists, bows, or cups (warp)","next":"r_warpage"}]},"material":{"q":"What do you see in the plastic?","options":[{"a":"Dark flecks or specks scattered through the part","next":"r_black_specks"},{"a":"Solid granules or gels — unmelted pellets","next":"r_unmelts"},{"a":"Swirls or uneven color / poor mixing","next":"r_color"},{"a":"Silver streaks (could be moisture)","next":"r_splay"},{"a":"The surface peels apart in layers","next":"r_delam"}]},"r_short_shot":{"result":{"primary":"short_shot"}},"r_flash":{"result":{"primary":"flash"}},"r_sink":{"result":{"primary":"sink_marks","also":["voids"]}},"r_voids":{"result":{"primary":"voids","also":["sink_marks"]}},"r_warpage":{"result":{"primary":"warpage","also":["dimensional_drift"]}},"r_splay":{"result":{"primary":"splay","also":["burn_marks"]}},"r_burn":{"result":{"primary":"burn_marks","also":["splay"]}},"r_jetting":{"result":{"primary":"jetting","also":["gate_blush"]}},"r_gate_blush":{"result":{"primary":"gate_blush","also":["jetting"]}},"r_flow_lines":{"result":{"primary":"flow_lines","also":["weld_lines"]}},"r_weld":{"result":{"primary":"weld_lines","also":["flow_lines"]}},"r_gloss":{"result":{"primary":"gloss_variation"}},"r_delam":{"result":{"primary":"delamination","also":["color_streaks"]}},"r_color":{"result":{"primary":"color_streaks","also":["delamination"]}},"r_brittle":{"result":{"primary":"brittleness","also":["weld_lines","delamination"]}},"r_cracking":{"result":{"primary":"cracking","also":["sticking","ejector_marks"]}},"r_stringing":{"result":{"primary":"stringing","also":["drooling"]}},"r_drooling":{"result":{"primary":"drooling","also":["stringing"]}},"r_sticking":{"result":{"primary":"sticking","also":["ejector_marks"]}},"r_ejector":{"result":{"primary":"ejector_marks","also":["sticking"]}},"r_dim_drift":{"result":{"primary":"dimensional_drift","also":["warpage","sink_marks"]}},"r_black_specks":{"result":{"primary":"black_specks","also":["color_streaks"]}},"r_unmelts":{"result":{"primary":"unmelts","also":["black_specks"]}}}},"actualsToVerify":["Dose Start (9.57 mm on your screen) — the arithmetic doesn't match hold-end + pre-dose pull back; confirm what this field logs on the SE-EV before writing its entry"],"meta":{"title":"Plast Screen — Settings Encyclopedia","machineRef":"Sumitomo SE180EV (C360M, phi-36 screw, NC touchscreen control)","version":"0.1-draft","status":"Draft for shop-floor verification. Red-line anything that doesn't match how your press actually behaves.","generalRule":"Change one setting at a time, run 5-10 shots, and watch the Actual values (fill peak, fill time, cushion, cycle) before judging the change.","toVerify":["Zero Set (Time) — exact zeroing behavior on the SE-EV load cell; confirm in manual before writing the entry","Flash (0.000 sec field under Zero Set) — confirm what this monitors on your control","Dose 1st/End stage position convention — confirm which direction the 3.50 mm stage break counts on your screen","Flow-Check — confirm exact check-ring test behavior and threshold units on the SE-EV"]}};
</script>
<script>
/* SE180EV Troubleshooting Guide — app logic (vanilla JS, no dependencies) */
(function () {
  "use strict";
  var DB = window.APP_DATA;

  /* ---------- indexes ---------- */
  var S = {}, A = {}, DF = {}, AL = {}, G = {};
  DB.settings.forEach(function (x) { S[x.id] = x; });
  DB.actuals.forEach(function (x) { A[x.id] = x; });
  DB.defects.forEach(function (x) { DF[x.id] = x; });
  DB.alarms.forEach(function (x) { AL[x.id] = x; });
  DB.guides.forEach(function (x) { G[x.id] = x; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- icons ---------- */
  var P = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  var I = {
    settings: P + '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2.2" fill="var(--panel)"/><circle cx="15" cy="12" r="2.2" fill="var(--panel)"/><circle cx="7" cy="18" r="2.2" fill="var(--panel)"/></svg>',
    actuals: P + '<path d="M4 15a8 8 0 0 1 16 0"/><line x1="12" y1="15" x2="16" y2="9"/><line x1="3" y1="19" x2="21" y2="19"/></svg>',
    defects: P + '<path d="M12 3l9 16H3z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="16.6" x2="12.01" y2="16.6"/></svg>',
    alarms: P + '<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>',
    guides: P + '<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg>',
    wizard: P + '<line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>',
    back: P + '<polyline points="14 5 7 12 14 19"/></svg>',
    search: P + '<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>',
    sun: P + '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>',
    moon: P + '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
    chev: P + '<polyline points="9 6 15 12 9 18"/></svg>'
  };

  /* ---------- cross-link helpers ---------- */
  function kindOf(id) {
    if (S[id]) return { k: "setting", label: "Setting", name: S[id].name };
    if (A[id]) return { k: "actual", label: "Actual", name: A[id].name };
    if (DF[id]) return { k: "defect", label: "Defect", name: DF[id].name };
    if (AL[id]) return { k: "alarm", label: "Alarm", name: AL[id].name };
    if (G[id]) return { k: "guide", label: "Guide", name: G[id].name };
    return null;
  }
  function chip(id) {
    var t = kindOf(id);
    if (!t) return "";
    return '<a class="chip" href="#/' + t.k + "/" + id + '"><span class="ck">' + t.label + "</span>" + esc(t.name) + "</a>";
  }
  function chips(ids) {
    return '<div class="chips">' + (ids || []).map(chip).join("") + "</div>";
  }
  function vchip(label, value) {
    return '<span class="vchip"><span class="vl">' + esc(label) + "</span>" + esc(value) + "</span>";
  }
  function ghead(text, note) {
    return '<div class="ghead"><span class="eyebrow">' + text + "</span>" +
      (note ? '<div class="note">' + esc(note) + "</div>" : "") + '<div class="rule"></div></div>';
  }
  function listRow(href, title, sub, right) {
    return '<a class="card row" href="' + href + '"><div class="rc"><div class="rt">' + esc(title) + "</div>" +
      (sub ? '<div class="rs">' + esc(sub) + "</div>" : "") + "</div>" +
      (right || "") + '<span class="chev">' + I.chev + "</span></a>";
  }
  function rlPanel(cls, glyph, label, items) {
    return '<div class="rlp ' + cls + '"><div class="rlh"><span class="glyph">' + glyph +
      '</span><span class="rll">' + label + "</span></div><ul>" +
      items.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul></div>";
  }
  function callout(cls, title, bodyHtml) {
    return '<div class="callout ' + cls + '"><span class="ct">' + title + "</span>" + bodyHtml + "</div>";
  }

  /* ---------- pages ---------- */
  function pageHome() {
    var c = function (n) { return '<span class="pill">' + n + "</span>"; };
    return (
      '<div class="plate">' +
        '<span class="eyebrow">Sumitomo all-electric</span>' +
        "<h1>SE180EV Troubleshooting Guide</h1>" +
        '<div class="specs">' + vchip("Machine", "SE180EV") + vchip("Spec", "C360M") + vchip("Screw", "\u03c636 mm") + vchip("Control", "NC touchscreen") + "</div>" +
      "</div>" +
      '<div style="height:14px"></div>' +
      '<button class="search" id="homeSearch" style="text-align:left;color:var(--muted);cursor:pointer">Search settings, defects, alarms\u2026</button>' +
      '<div class="hint">TIP &mdash; press / anywhere to search</div>' +
      '<a class="card row wizcta" href="#/wizard">' +
        '<span class="icobox">' + I.wizard + '</span>' +
        '<div class="rc"><div class="rt">Diagnose a part</div>' +
        '<div class="rs">Not sure what it’s called? Answer a few questions → likely defect + fixes</div></div>' +
        '<span class="chev">' + I.chev + "</span></a>" +
      ghead("Sections") +
      '<div class="stack">' +
        homeCard("settings", "Settings Encyclopedia", "Every setting: what it is, raise vs lower, cautions", DB.settings.length) +
        homeCard("actuals", "Actual Values", "What the monitored numbers mean and what drift tells you", DB.actuals.length) +
        homeCard("defects", "Defect Library", "Symptom \u2192 ranked causes \u2192 exact setting fixes", DB.defects.length) +
        homeCard("alarms", "Alarms &amp; Faults", "What tripped, safe first response, root causes", DB.alarms.length) +
        homeCard("guides", "Fundamentals", "Short reads: decoupled molding, studies, cushion, drying", DB.guides.length) +
      "</div>" +
      '<div class="foot">v1.0 &middot; knowledge base v0.1-draft &middot; verify on the floor before trusting blindly</div>'
    );
  }
  function homeCard(key, title, sub, n) {
    return '<a class="card row" href="#/' + key + '"><span class="icobox">' + I[key] + '</span>' +
      '<div class="rc"><div class="rt">' + title + '</div><div class="rs">' + sub + "</div></div>" +
      '<span class="readout"><span class="led"></span><span class="count">' + n + "</span></span>" +
      '<span class="chev">' + I.chev + "</span></a>";
  }

  var SCREEN_ORDER = ["Plast", "Mold", "Temperature"];
  function pageSettings() {
    var h = "";
    SCREEN_ORDER.forEach(function (scr) {
      var inScreen = DB.settings.filter(function (s) { return s.screen === scr; });
      if (!inScreen.length) return;
      h += ghead(esc(scr.toUpperCase()) + " SCREEN");
      var groups = [];
      inScreen.forEach(function (s) { if (groups.indexOf(s.group) < 0) groups.push(s.group); });
      groups.forEach(function (g) {
        h += '<div class="ghead" style="margin-top:14px"><span class="eyebrow" style="color:var(--accent)">' + esc(g) + "</span></div>";
        h += '<div class="stack">' + inScreen.filter(function (s) { return s.group === g; })
          .map(function (s) { return listRow("#/setting/" + s.id, s.name, s.units); }).join("") + "</div>";
      });
    });
    var tv = (DB.meta && DB.meta.toVerify) || [];
    if (tv.length) {
      h += callout("co-amber", "Draft &mdash; still to verify on the machine",
        "<ul>" + tv.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>");
    }
    return '<h1 class="pg">Settings Encyclopedia</h1><p class="lead dim">Grouped the way the control lays them out. Tap a setting for raise/lower effects, cautions, and links.</p>' + h;
  }

  function pageSetting(id) {
    var s = S[id];
    if (!s) return notFound();
    var h = '<span class="eyebrow">' + esc(s.screen) + ' screen<span class="sep">&middot;</span>' + esc(s.group) + "</span>" +
      '<h1 class="pg">' + esc(s.name) + "</h1>";
    if (s.alsoCalled && s.alsoCalled.length) {
      h += '<div class="chips">' + s.alsoCalled.map(function (a) { return '<span class="tag">' + esc(a) + "</span>"; }).join("") + "</div>";
    }
    h += '<div class="sect"><span class="eyebrow">Units</span><p style="font-family:var(--mono);color:var(--amber);font-size:14px">' + esc(s.units) + "</p></div>";
    h += '<p class="lead">' + esc(s.whatItIs) + "</p>";
    h += '<div class="rl">' + rlPanel("raise", "\u2191", "If you raise it", s.raiseEffects) + rlPanel("lower", "\u2193", "If you lower it", s.lowerEffects) + "</div>";
    h += '<div class="sect"><span class="eyebrow">Typical / how to set</span><p>' + esc(s.typicalRange) + "</p></div>";
    if (s.cautions) h += callout("co-warn", "Watch out", "<div>" + esc(s.cautions) + "</div>");
    if (s.relatedActuals && s.relatedActuals.length) h += '<div class="sect"><span class="eyebrow">Read it on the Actual display</span>' + chips(s.relatedActuals) + "</div>";
    if (s.relatedDefects && s.relatedDefects.length) h += '<div class="sect"><span class="eyebrow">Defects this setting touches</span>' + chips(s.relatedDefects) + "</div>";
    if (s.interactsWith && s.interactsWith.length) h += '<div class="sect"><span class="eyebrow">Interacts with</span>' + chips(s.interactsWith) + "</div>";
    return h;
  }

  function pageActuals() {
    return '<h1 class="pg">Actual Values</h1>' +
      '<p class="lead dim">The monitored numbers are the machine telling you the truth.</p>' +
      '<div style="height:14px"></div><div class="stack">' +
      DB.actuals.map(function (a) {
        return listRow("#/actual/" + a.id, a.name, null);
      }).join("") + "</div>" +
      (DB.actualsToVerify && DB.actualsToVerify.length
        ? callout("co-amber", "Draft &mdash; still to verify", "<ul>" + DB.actualsToVerify.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>")
        : "");
  }

  function pageActual(id) {
    var a = A[id];
    if (!a) return notFound();
    return '<span class="eyebrow">Actual value</span><h1 class="pg">' + esc(a.name) + "</h1>" +
      '<p class="lead">' + esc(a.whatItTells) + "</p>" +
      callout("co-ok", "Healthy looks like", "<div>" + esc(a.healthy) + "</div>") +
      '<div class="rl">' + rlPanel("raise", "\u2197", "If it rises", [a.rising]) + rlPanel("lower", "\u2198", "If it falls", [a.falling]) + "</div>" +
      '<div class="sect"><span class="eyebrow">Check first</span><ol class="steps">' +
      a.checkFirst.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ol></div>";
  }

  var defectFilter = "";
  function pageDefects() {
    return '<h1 class="pg">Defect Library</h1>' +
      '<p class="lead dim">Find the symptom, work the causes top-down &mdash; they are ranked most-likely first.</p>' +
      '<div style="height:12px"></div>' +
      '<input class="search" id="dfilter" type="search" placeholder="Filter defects\u2026 (splay, sink, flash)" value="' + esc(defectFilter) + '">' +
      '<div id="dlist">' + defectListHtml(defectFilter) + "</div>";
  }
  function defectListHtml(f) {
    f = (f || "").toLowerCase().trim();
    var list = DB.defects.filter(function (d) {
      return !f || (d.name + " " + d.id + " " + d.category + " " + d.description).toLowerCase().indexOf(f) >= 0;
    });
    if (!list.length) return '<div class="empty">No match &mdash; try a shorter word (e.g. "sink").</div>';
    var cats = [];
    list.forEach(function (d) { if (cats.indexOf(d.category) < 0) cats.push(d.category); });
    return cats.map(function (c) {
      return ghead(esc(c.toUpperCase())) + '<div class="grid2">' +
        list.filter(function (d) { return d.category === c; })
          .map(function (d) { return listRow("#/defect/" + d.id, d.name, d.description.split(" \u2014 ")[0].slice(0, 64)); }).join("") +
        "</div>";
    }).join("");
  }

  function pageDefect(id) {
    var d = DF[id];
    if (!d) return notFound();
    var h = '<span class="eyebrow">Defect<span class="sep">&middot;</span>' + esc(d.category) + "</span>" +
      '<h1 class="pg">' + esc(d.name) + '</h1><p class="lead">' + esc(d.description) + "</p>";
    h += callout("co-info", "Quick check", "<ul>" + d.quickCheck.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ul>");
    h += ghead("CAUSES &mdash; MOST LIKELY FIRST");
    h += '<div class="stack">' + d.causes.map(function (c) {
      return '<div class="card cause"><span class="cnum">' + c.rank + '</span><div class="cc">' +
        '<div class="ct1">' + esc(c.cause) + "</div>" +
        '<div class="cfix"><b>Fix</b>' + esc(c.fix) + "</div>" +
        (c.settings && c.settings.length ? chips(c.settings) : "") +
        "</div></div>";
    }).join("") + "</div>";
    h += '<div class="sect"><span class="eyebrow">Diagnostic path</span><ol class="steps">' +
      d.diagnosticSteps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol></div>";
    if (d.notes) h += callout("co-amber", "Material note", "<div>" + esc(d.notes) + "</div>");
    return h;
  }

  function pageAlarms() {
    return '<h1 class="pg">Alarms &amp; Faults</h1>' +
      '<p class="lead dim">What tripped, what to do first without making it worse, then the real causes.</p>' +
      '<div style="height:14px"></div><div class="stack">' +
      DB.alarms.map(function (a) { return listRow("#/alarm/" + a.id, a.name, a.whatTriggers.slice(0, 74) + "\u2026"); }).join("") +
      "</div>";
  }

  function pageAlarm(id) {
    var a = AL[id];
    if (!a) return notFound();
    var h = '<span class="eyebrow">Alarm / fault</span><h1 class="pg">' + esc(a.name) + "</h1>" +
      '<p class="lead">' + esc(a.whatTriggers) + "</p>" +
      callout("co-warn", "Safe first response", "<div>" + esc(a.safeFirstResponse) + "</div>") +
      '<div class="sect"><span class="eyebrow">Root causes &mdash; most likely first</span><ol class="steps">' +
      a.rootCauses.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ol></div>" +
      '<div class="sect"><span class="eyebrow">Prevention</span><p>' + esc(a.prevention) + "</p></div>";
    if (a.relatedSettings && a.relatedSettings.length) h += '<div class="sect"><span class="eyebrow">Related settings</span>' + chips(a.relatedSettings) + "</div>";
    if (a.relatedDefects && a.relatedDefects.length) h += '<div class="sect"><span class="eyebrow">Related defects</span>' + chips(a.relatedDefects) + "</div>";
    return h;
  }

  function pageGuides() {
    return '<h1 class="pg">Fundamentals</h1>' +
      '<p class="lead dim">Short reads that make everything else on this machine make sense.</p>' +
      '<div style="height:14px"></div><div class="stack">' +
      DB.guides.map(function (g) { return listRow("#/guide/" + g.id, g.name, null, '<span class="pill">' + g.minutes + " min</span>"); }).join("") +
      "</div>";
  }

  function pageGuide(id) {
    var g = G[id];
    if (!g) return notFound();
    return '<span class="eyebrow">Fundamentals<span class="sep">&middot;</span>' + g.minutes + ' min read</span>' +
      '<h1 class="pg">' + esc(g.name) + '</h1><div class="prose">' +
      g.body.split("\n\n").map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>";
  }

  /* ---------- symptom wizard ---------- */
  function pageWizard(id) {
    var W = DB.wizard;
    if (!W) return notFound();
    var node = W.nodes[id || W.start];
    if (!node) return notFound();
    if (node.result) return wizardResult(node.result);
    var h = '<span class="eyebrow">Symptom wizard</span>' +
      '<h1 class="pg">' + esc(node.q) + "</h1>" +
      '<p class="lead dim">Pick what best matches what you see &mdash; back steps you through the questions.</p>' +
      '<div style="height:12px"></div><div class="stack">' +
      node.options.map(function (o) {
        return '<a class="card row" href="#/wizard/' + esc(o.next) + '"><div class="rc"><div class="rt">' +
          esc(o.a) + '</div></div><span class="chev">' + I.chev + "</span></a>";
      }).join("") + "</div>" +
      '<div class="sect"><a class="chip" href="#/wizard"><span class="ck">Restart</span>Start over</a></div>';
    return h;
  }
  function wizardResult(res) {
    var p = DF[res.primary];
    if (!p) return notFound();
    var h = '<span class="eyebrow">Symptom wizard<span class="sep">&middot;</span>likely cause</span>' +
      '<h1 class="pg">' + esc(p.name) + '</h1><p class="lead">' + esc(p.description) + "</p>" +
      '<div style="height:14px"></div>' +
      '<a class="card row" href="#/defect/' + p.id + '"><span class="icobox">' + I.defects + "</span>" +
      '<div class="rc"><div class="rt">Open full troubleshooting</div>' +
      '<div class="rs">Ranked causes, exact setting fixes, diagnostic path</div></div>' +
      '<span class="chev">' + I.chev + "</span></a>";
    if (res.also && res.also.length) {
      h += '<div class="sect"><span class="eyebrow">If that’s not it, also consider</span>' + chips(res.also) + "</div>";
    }
    h += '<div class="sect"><a class="chip" href="#/wizard"><span class="ck">Restart</span>Start over</a></div>';
    return h;
  }

  /* ---------- search ---------- */
  var q = "";
  var INDEX = [];
  function buildIndex() {
    DB.settings.forEach(function (x) { INDEX.push(ix("setting", x.id, x.name, x.screen + " \u00b7 " + x.group, [x.name, (x.alsoCalled || []).join(" "), x.whatItIs, x.units])); });
    DB.defects.forEach(function (x) { INDEX.push(ix("defect", x.id, x.name, x.category, [x.name, x.description, x.category])); });
    DB.alarms.forEach(function (x) { INDEX.push(ix("alarm", x.id, x.name, "Alarm", [x.name, x.whatTriggers])); });
    DB.actuals.forEach(function (x) { INDEX.push(ix("actual", x.id, x.name, "Actual value", [x.name, x.whatItTells])); });
    DB.guides.forEach(function (x) { INDEX.push(ix("guide", x.id, x.name, x.minutes + " min read", [x.name, x.body])); });
  }
  function ix(kind, id, name, sub, hayParts) {
    return { kind: kind, id: id, name: name, sub: sub, lname: name.toLowerCase(), hay: hayParts.join(" ").toLowerCase() };
  }
  function doSearch(query) {
    var qq = query.toLowerCase().trim();
    if (!qq) return null;
    var scored = [];
    INDEX.forEach(function (it) {
      var sc = 0;
      if (it.lname.indexOf(qq) === 0) sc = 4;
      else if (it.lname.indexOf(qq) >= 0) sc = 3;
      else if (it.hay.indexOf(qq) >= 0) sc = 1;
      if (sc) scored.push([sc, it]);
    });
    scored.sort(function (a, b) { return b[0] - a[0]; });
    return scored.map(function (p) { return p[1]; });
  }
  var KIND_LABEL = { setting: "SETTINGS", defect: "DEFECTS", alarm: "ALARMS", actual: "ACTUAL VALUES", guide: "FUNDAMENTALS" };
  function pageSearch() {
    return '<h1 class="pg">Search</h1>' +
      '<input class="search" id="q" type="search" placeholder="splay, cushion, back pressure, flash\u2026" value="' + esc(q) + '" autocomplete="off">' +
      '<div id="sr">' + resultsHtml(q) + "</div>";
  }
  function resultsHtml(query) {
    if (!query.trim()) return '<div class="hint" style="margin-top:14px">Search across ' + INDEX.length + " entries: settings, actuals, defects, alarms, and guides.</div>";
    var res = doSearch(query);
    if (!res || !res.length) return '<div class="empty">Nothing found for &ldquo;' + esc(query) + '&rdquo;. Try one word.</div>';
    var order = ["setting", "defect", "alarm", "actual", "guide"];
    return order.map(function (k) {
      var of = res.filter(function (r) { return r.kind === k; }).slice(0, 6);
      if (!of.length) return "";
      return ghead(KIND_LABEL[k]) + '<div class="stack">' +
        of.map(function (r) { return listRow("#/" + r.kind + "/" + r.id, r.name, r.sub); }).join("") + "</div>";
    }).join("");
  }

  function notFound() {
    return '<div class="empty">Not found. <a href="#/" style="color:var(--accent)">Back to home</a></div>';
  }

  /* ---------- router ---------- */
  var TABS = [
    ["settings", "Settings"], ["actuals", "Actuals"], ["defects", "Defects"], ["alarms", "Alarms"], ["guides", "Guides"]
  ];
  function parse() {
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/");
    return { page: parts[0] || "home", id: parts[1] ? decodeURIComponent(parts[1]) : null };
  }
  /* explicit nav trail — reliable when opened from a file or Home Screen,
     where history.length is unreliable */
  var trail = [];
  function currentHash() { return location.hash || "#/"; }
  function render() {
    var r = parse(), html = "";
    var ch = currentHash();
    if (trail[trail.length - 1] !== ch) trail.push(ch);
    switch (r.page) {
      case "home": html = pageHome(); break;
      case "settings": html = pageSettings(); break;
      case "setting": html = pageSetting(r.id); break;
      case "actuals": html = pageActuals(); break;
      case "actual": html = pageActual(r.id); break;
      case "defects": html = pageDefects(); break;
      case "defect": html = pageDefect(r.id); break;
      case "alarms": html = pageAlarms(); break;
      case "alarm": html = pageAlarm(r.id); break;
      case "guides": html = pageGuides(); break;
      case "guide": html = pageGuide(r.id); break;
      case "wizard": html = pageWizard(r.id); break;
      case "search": html = pageSearch(); break;
      default: html = notFound();
    }
    var view = document.getElementById("view");
    view.innerHTML = html;
    view.classList.remove("view"); void view.offsetWidth; view.classList.add("view");
    document.getElementById("backBtn").hidden = (r.page === "home" || (!r.id && r.page !== "search" && TABS.some(function (t) { return t[0] === r.page; })));
    paintTabs(r.page);
    window.scrollTo(0, 0);
    wire(r);
  }
  function paintTabs(page) {
    var singular = { setting: "settings", actual: "actuals", defect: "defects", alarm: "alarms", guide: "guides" };
    var active = singular[page] || page;
    document.getElementById("tabs").innerHTML = TABS.map(function (t) {
      return '<a class="tab' + (active === t[0] ? " active" : "") + '" href="#/' + t[0] + '">' + I[t[0]] + "<span>" + t[1] + "</span></a>";
    }).join("");
  }
  function wire(r) {
    var hs = document.getElementById("homeSearch");
    if (hs) hs.onclick = function () { location.hash = "#/search"; };
    var qi = document.getElementById("q");
    if (qi) {
      qi.focus();
      try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (e) {}
      qi.oninput = function () { q = qi.value; document.getElementById("sr").innerHTML = resultsHtml(q); };
    }
    var df = document.getElementById("dfilter");
    if (df) df.oninput = function () { defectFilter = df.value; document.getElementById("dlist").innerHTML = defectListHtml(defectFilter); };
  }

  /* ---------- chrome ---------- */
  document.getElementById("backBtn").innerHTML = I.back;
  document.getElementById("backBtn").onclick = function () {
    if (trail.length > 1) {
      trail.pop();                       // drop current
      location.hash = trail[trail.length - 1];  // navigate to previous (render won't re-push it)
    } else {
      location.hash = "#/";
    }
  };
  document.getElementById("searchBtn").innerHTML = I.search;
  document.getElementById("searchBtn").onclick = function () { location.hash = "#/search"; };
  var themeBtn = document.getElementById("themeBtn");
  function paintTheme() { themeBtn.innerHTML = document.body.classList.contains("light") ? I.moon : I.sun; }
  themeBtn.onclick = function () { document.body.classList.toggle("light"); paintTheme(); };
  paintTheme();

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      e.preventDefault();
      if (parse().page !== "search") location.hash = "#/search";
      else { var qi = document.getElementById("q"); if (qi) qi.focus(); }
    }
  });

  window.addEventListener("hashchange", render);
  buildIndex();
  render();
})();

</script>
</body>
</html>
